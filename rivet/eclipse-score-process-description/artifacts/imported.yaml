  - id: GD_REQ__ARCH_VIEWPOINTS
    type: guidance
    title: Architecture Viewpoints
    status: approved
    tags: [manual_prio_1, architecture_design, "eclipse:gd_req"]
    description: |
      The architecture shall be shown on following views on each architectural level:
      
      * Package Diagram (feat_arc_sta, comp_arc_sta)
      * Sequence Diagram (feat_arc_dyn, comp_arc_dyn)
      * Interface View (logic_arc_int, real_arc_int)
      
      At the module level, only one additional static view (mod_view_sta) shall be created.
    links:
      - type: complies
        target: STD_REQ__ISO26262__SUPPORT_6432
      - type: complies
        target: STD_REQ__ISO26262__SOFTWARE_742
      - type: complies
