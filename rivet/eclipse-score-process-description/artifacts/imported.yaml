  - id: GD_REQ__ARCH_HIERARCHICAL_STRUCTURE
    type: guidance
    title: Hierarchical structure of architectural elements
    status: approved
    tags: [done_automation, architecture_design, "eclipse:gd_req"]
    description: |
      The architectural elements shall be hierarchically structured on two levels:
      
      * Feature Level (=Logical Level)
      * Component Level (allows also recursive decomposition into internal components)
    links:
      - type: complies
        target: STD_REQ__ISO26262__SUPPORT_6431
      - type: complies
        target: STD_REQ__ISO26262__SUPPORT_6432
      - type: complies
        target: STD_REQ__ISO26262__SOFTWARE_743
      - type: fulfils-process-req
