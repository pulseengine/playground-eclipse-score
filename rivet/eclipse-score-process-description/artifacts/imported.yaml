  - id: GD_CHKLST__DOCUMENTATION_REVIEW
    type: guidance
    title: Documentation Review Checklist
    status: approved
    tags: [documentation_management, "eclipse:gd_chklst"]
    description: |
      | **1. Purpose**
      | The purpose of this checklist is to collect the formal topics to be checked during a
      Documentation Review from any contributor. It will not be filled out but considered during
      the review.
      |
      | **2. Checklist**
      |
      
      See also :ref:`review_concept` for further information about reviews in general and inspection in particular.
      
      .. list-table:: Documentation Review Checklist
      :header-rows: 1
      :widths: 10,30,6
      
      * - Id
      - Topic
      - Status [FAIL|PASS]
      
      * - 1
      - Are available templates used for the documents?
      -
      
      * - 2
      - Does the Document have a unique id as specified in the naming conventions?
      -
      
      * - 3
      - Are the attributes (safety, security, status) set correctly?
      -
      
      * - 4
      - Is the Document stored in the correct location?
      -
      
      * - 5
      - Is the document listed correctly in the documentation management plan?
      -
      
      * - 6
      - Is the Document linked via realizes to the correct workproduct of the process description?
      -
    links:
      - type: complies
        target: STD_REQ__ISO26262__SUPPORT_1045
