  - id: GD_REQ__GENERAL_REQUIREMENTS_VERSION
    type: guidance
    title: Version for inspected requirements
    status: approved
    tags: [prio_1_automation, general, "eclipse:gd_req"]
    description: |
      The version of a requirement shall not change by an inspection.
      
      This means: In case the status of the requirement (see :need:`gd_req__req_attr_status`)
      is used to notify if a requirement is inspected (or another attribute is introduced),
      this shall be ignored for versioning.
    links:
      - type: complies
        target: STD_REQ__ISO26262__SUPPORT_6433
      - type: complies
        target: STD_REQ__ISO26262__SOFTWARE_7414
      - type: fulfils-process-req
        target: WF__MONITOR_VERIFY_REQUIREMENTS
  - id: GD_REQ__GENERAL_ARCHITECTURE_VERSION
    type: guidance
    title: Version for inspected architecture
    status: draft
    tags: [general, "eclipse:gd_req"]
    description: |
      The version of architecture element shall not change by an inspection.
      
      This means: In case the status of the element (see :need:`gd_req__arch_attr_status`)
      is used to notify if it is inspected (or another attribute is introduced),
      this shall be ignored for versioning.
      
      Note: this applies only if architecture also has a version.
    links:
      - type: complies
        target: STD_REQ__ISO26262__SUPPORT_6433
      - type: complies
        target: STD_REQ__ISO26262__SOFTWARE_7414
      - type: fulfils-process-req
        target: WF__MR_VY_ARCH
  - id: GD_REQ__GENERAL_CHECKLIST_TEMPLATES
    type: guidance
    title: Checklist templates in pull requests
    status: approved
    tags: [prio_2_automation, general, "eclipse:gd_req"]
    description: |
      For every pull request that modifies a work product subject to inspection,
      a pull‑request template containing the applicable inspection checklist items shall be provided.
      When possible, the template should be applied automatically based on the files modified in the pull request.
      As of now, requirements and architecture inspection checklists shall be added manually because they are not automatically applied.
    links:
      - type: complies
        target: STD_REQ__ISO26262__SUPPORT_6433
      - type: complies
        target: STD_REQ__ISO26262__SOFTWARE_7414
      - type: complies
        target: STD_REQ__ISO26262__SOFTWARE_942
      - type: fulfils-process-req
        target: WF__MONITOR_VERIFY_REQUIREMENTS
      - type: fulfils-process-req
        target: WF__MR_VY_ARCH
