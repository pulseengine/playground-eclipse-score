  - id: GD_CHKLST__CHANGE_CR_REVIEW
    type: guidance
    title: Change Request Review Checklist
    status: approved
    tags: [change_management, change_management, change_management, change_management, "eclipse:gd_chklst"]
    description: |
      | **1. Purpose**
      | The purpose of this checklist is to collect the topics to be checked during a Change Request from any contributor.
      | It will not be filled out but considered during the review of the Change Request.
      |
      | **2. Checklist**
      |
      
      See also :ref:`review_concept` for further information about reviews in general and inspection in particular.
      
      .. list-table:: Feature/Component Request Review Checklist
      :header-rows: 1
      :widths: 10,30,6
      
      * - Id
      - Topic
      - Status [FAIL|PASS]
      * - 1
      - Does the Feature/Component Request follow the template?
      -
      
      * - 2
      - Are all required topics of the Feature/Component Request template filled?
