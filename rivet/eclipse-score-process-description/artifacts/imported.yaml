  - id: STD_REQ__ASPICE_40__GP-211
    type: std-req
    title: "GP2.1.1: Identify the objectives and define a strategy for the performance of the process."
    status: approved
    description: |
      The scope of the process activities including the management of process performance and the management of work products are determined.
      Corresponding results to be achieved are determined.
      Process performance objectives and associated criteria are identified.
      
      .. note::
      Budget targets and delivery dates to the customer,
      targets for test coverage and process lead time are examples for process performance objectives.
      
      .. note::
      Performance objectives are the basis for planning and monitoring.
      
      Assumptions and constraints are considered when identifying the performance objectives.
      Approach and methodology for the process performance is determined.
      
      .. note::
      A process performance strategy may not necessarily be document-ed specifically for each process.
      Elements applicable for multiple processes may be documented jointly,
      e.g, as part of a common project handbook or in a joint test strategy.
    fields:
      links: std_req__aspice_40__iic-19-01
  - id: STD_REQ__ASPICE_40__GP-212
    type: std-req
    title: "GP2.1.2: Plan the performance of the process."
    status: approved
    description: |
      The planning for the performance of the process is established according to the defined objectives, criteria, and strategy.
      Process activities and work packages are defined.
      Estimates for work packages are identified using appropriate methods.
      
      .. note::
      
      Schedule and milestones are defined.
    fields:
      links: "std_req__aspice_40__iic-08-56,std_req__aspice_40__iic-14-10"
  - id: STD_REQ__ASPICE_40__GP-213
    type: std-req
    title: "GP2.1.3: Determine resource needs."
    status: approved
    description: |
      The required amount of human resources, and experience, knowledge and skill needs for the for process performance are determined based on the planning.
      The needs for physical and material resources are determined based on the planning.
      
      .. note::
      
      Physical and material resources may include equipment, laboratories, materials, tools, licenses etc.
      
      Required responsibilities and authorities to perform the process, and to manage the corresponding work products are determined.
      
      .. note::
      
      The definition of responsibilities and authorities does not necessarily require formal role descriptions.
    fields:
      links: std_req__aspice_40__iic-17-55
  - id: STD_REQ__ASPICE_40__GP-214
    type: std-req
    title: "GP2.1.4: Identify and make available resources."
    status: approved
    description: |
      The individuals performing and managing the process are identified and allocated according to the determined needs.
      The individuals performing and managing the process are being qualified to execute their responsibilities.
      
      .. note::
      
      Qualification of individuals may include training, mentoring, or coaching.
      
      The other resources, necessary for performing the process are identified, made available, allocated and used according to the determined needs.
    fields:
      links: std_req__aspice_40__iic-08-61
  - id: STD_REQ__ASPICE_40__GP-215
    type: std-req
    title: "GP2.1.5: Monitor and adjust the performance of the process."
    status: approved
    description: |
      Process performance is monitored to identify deviations from the planning.
      Appropriate actions in case of deviations from the planning are taken.
      The planning is adjusted as necessary.
    fields:
      links: "std_req__aspice_40__iic-08-56,std_req__aspice_40__iic-13-14"
  - id: STD_REQ__ASPICE_40__GP-216
    type: std-req
    title: "GP2.1.6: Manage the interfaces between involved parties."
    status: approved
    description: |
      The individuals and groups including required external parties involved in the process performance are determined.
      Responsibilities are assigned to the relevant individuals or parties.
      Communication mechanisms between the involved parties are determined.
      Effective communication between the involved parties is established and maintained.
    fields:
      links: "std_req__aspice_40__iic-08-62,std_req__aspice_40__iic-13-52"
  - id: STD_REQ__ASPICE_40__GP-221
    type: std-req
    title: "GP2.2.1: Define the requirements for the work products."
    status: approved
    description: |
      The requirements for the content and structure of the work products to be produced are defined.
      Quality criteria for the work products are identified.
      Appropriate review and approval criteria for the work products are defined.
      
      .. note::
      
      Possible sources of documentation requirements may be e.g.,
      best practices or lessons learned from other projects, standards,
      organization requirements, customer requirements, etc.
      
      .. note::
      
      There may be types of work products for which no review or approval
      is required, thus then there would be no need to define the corresponding criteria.
    fields:
      links: "std_req__aspice_40__iic-17-05,std_req__aspice_40__iic-18-07,std_req__aspice_40__iic-18-59"
  - id: STD_REQ__ASPICE_40__GP-222
    type: std-req
    title: "GP2.2.2: Define the requirements for storage and control of the work products."
    status: approved
    description: |
      Requirements for the storage and control of the work products are defined, including their identification and distribution.
      
      .. note::
      
      Possible sources for the identification of requirements for storage and control may be e.g., legal requirements, data policies, best practices from other projects, tool related requirements, etc.
      
      .. note::
      
      Examples for work product storage are files in a file system, ticket in a tool, Wiki entry, paper documents etc.
      
      .. note::
      
      Where status of a work product is required in base practices, this should be managed via a defined status model.
    fields:
      links: std_req__aspice_40__iic-17-05
  - id: STD_REQ__ASPICE_40__GP-223
    type: std-req
    title: "GP2.2.3: Identify, store and control the work products."
    status: approved
    description: |
      The work products to be controlled are identified.
      The work products are stored and controlled in accordance with the requirements.
      Change control is established for work products.
      Versioning and baselining of the work products is performed in accordance with the requirements for storage and control of the work products.
      The work products including the revision status are made available through appropriate mechanisms.
    fields:
      links: "std_req__aspice_40__iic-13-08,std_req__aspice_40__iic-16-00"
  - id: STD_REQ__ASPICE_40__GP-224
    type: std-req
    title: "GP2.2.4: Review and adjust work products."
    status: approved
    description: |
      The work products are reviewed against the defined requirements and criteria.
      Resolution of issues arising from work products reviews is ensured.
    fields:
      links: std_req__aspice_40__iic-13-19
  - id: STD_REQ__ASPICE_40__GP-311
    type: std-req
    title: "GP3.1.1: Establish and maintain the standard process."
    status: approved
    description: |
      A suitable standard process is developed including required activities and their interactions.
      Inputs and outputs of the standard process are defined including the corresponding entry and
      exit criteria to determine the interactions and sequence with other processes.
      Process performance roles are identified and assigned to the standard process activities including
      their type of involvement, responsibilities, and authorities.
      
      .. note::
      
      An example for describing the involvement of the process roles in the activities is a RASI/RASIC representation.
      Suitable guidance, procedures, and templates are provided to support the execution of the process as needed.
      
      .. note::
      
      Procedures may also include description of specific methods to be used.
      Appropriate tailoring guidelines including predefined unambiguous criteria as well as predefined and
      unambiguous proceedings are defined based on identified deployment needs and context of the standard process.
      The standard process is maintained according to corresponding feedback from the monitoring of the deployed processes.
      
      .. note::
      
      For guidance on how to perform process improvements see the Process Improvement process (PIM.3).
    fields:
      links: "std_req__aspice_40__iic-06-51,std_req__aspice_40__iic-10-00,std_req__aspice_40__iic-10-50,std_req__aspice_40__iic-10-51"
  - id: STD_REQ__ASPICE_40__GP-312
    type: std-req
    title: "GP3.1.2: Determine the required competencies."
    status: approved
    description: |
      Required competencies, skills, and experience for performing the standard process are determined for the identified roles.
      Appropriate qualification methods to acquire the necessary competencies and skills are determined, maintained, and made available for the identified roles.
      
      .. note::
      
      Qualification methods are e.g., trainings, mentoring, self-study.
      
      .. note::
      
      Preparation includes e.g., identification or definition of trainings, mentoring concepts, self-learning material.
    fields:
      links: "std_req__aspice_40__iic-10-50,std_req__aspice_40__iic-10-51"
  - id: STD_REQ__ASPICE_40__GP-313
    type: std-req
    title: "GP3.1.3: Determine the required resources."
    status: approved
    description: |
      Required physical and material resources and process infrastructure needs for performing the standard process are determined.
      
      .. note::
      
      This may include e.g., facilities, tools, licenses, networks, services, and samples supporting the establishment of the required work environment.
    fields:
      links: std_req__aspice_40__iic-10-52
  - id: STD_REQ__ASPICE_40__GP-314
    type: std-req
    title: "GP3.1.4: Determine suitable methods to monitor the standard process."
    status: approved
    description: |
      Methods and required activities for monitoring the effectiveness and adequacy of the standard process are determined.
      
      .. note::
      
      Methods and activities to gather feedback regarding the standard process may be lessons learned, process compliance checks,
      internal audits, management reviews, change requests, reflection of state-of-the-art such as applicable international standards, etc.
      Appropriate criteria and information needed to monitor the standard process are defined.
      
      .. note::
      
      Information about process performance may be of qualitative or quantitative nature.
    fields:
      links: std_req__aspice_40__iic-08-63
  - id: STD_REQ__ASPICE_40__GP-321
    type: std-req
    title: "GP3.2.1: Deploy a defined process that satisfies the context specific requirements of the use of the standard process."
    status: approved
    description: |
      The defined process is appropriately selected and/or tailored from the standard process.
      Conformance of defined process with standard process requirements and tailoring criteria is verified.
      The defined process is used as managed process to achieve the process outcomes.
      
      .. note::
      
      Changes in the standard process may require updates of the defined process.
    fields:
      links: "std_req__aspice_40__iic-10-00,std_req__aspice_40__iic-15-54"
  - id: STD_REQ__ASPICE_40__GP-322
    type: std-req
    title: "GP3.2.2: Ensure required competencies for the defined roles."
    status: approved
    description: |
      Human resources are allocated to the defined roles according to the required competencies and skills.
      Assignment of persons to roles and corresponding responsibilities and authorities for performing the defined process are communicated.
      Gaps in competencies and skills are identified, and corresponding qualification measures are initiated and monitored.
      Availability and usage of the project staff are measured and monitored.
    fields:
      links: std_req__aspice_40__iic-14-53
  - id: STD_REQ__ASPICE_40__GP-323
    type: std-req
    title: "GP3.2.3: Ensure required resources to support the performance of the defined process."
    status: approved
    description: |
      Required information to perform the defined process is made available, allocated and used.
      Required physical and material resources, process infrastructure and work environment are made available, allocated and used.
      Availability and usage of resources are measured and monitored.
    fields:
      links: std_req__aspice_40__iic-13-55
  - id: STD_REQ__ASPICE_40__GP-324
    type: std-req
    title: "GP3.2.4: Monitor the performance of the defined process."
    status: approved
    description: |
      Information is collected and analyzed according to the determined process monitoring methods to understand the effectiveness and adequacy of the defined process.
      Results of the analysis are made available to all effected parties and used to identify where continual improvement of the standard and/or defined process can be made.
      
      .. note::
      
      For guidance on how to perform process improvements see the Process Improvement process (PIM.3).
    fields:
      links: std_req__aspice_40__iic-03-06
  - id: STD_REQ__ASPICE_40__IIC-01-03
    type: std-req
    title: "01-03 Software Component"
    status: approved
    description: |
      Software Component may have the following characteristics:
      
      - Software element in the software architecture above the software unit
      level.
      - Represented by a design model element or executable code such as
      libs or scripts and a configuration description, if applicable.
  - id: STD_REQ__ASPICE_40__IIC-01-50
    type: std-req
    title: "01-50 Integrated Software"
    status: approved
    description: |
      Integrated Software may have the following characteristics:
      
      - Software executable (e.g, simulator with stubbing, debug-able, object
      code) including:
      
      - application parameter files (being a technical implementation solution for configurability-oriented requirements)
      - all configured software elements
  - id: STD_REQ__ASPICE_40__IIC-01-52
    type: std-req
    title: "01-52 Configuration item list"
    status: approved
    description: |
      Configuration item list may have the following characteristics:
      
      - Items under configuration control
      - The name of work products and an associated reference (to file, to tool artifact)
      - Configuration item attributes and properties
  - id: STD_REQ__ASPICE_40__IIC-01-53
    type: std-req
    title: "01-53 Trained ML model"
    status: approved
    description: |
      - The trained ML model is the output of the training process. It consists of the software representing the ML architecture, the set of weights which were optimized during the training, and the final set of hyperparameters.
  - id: STD_REQ__ASPICE_40__IIC-01-54
    type: std-req
    title: "01-54 Hyperparameter"
    status: approved
    description: |
      - Hyperparameters are used to control the ML model which has to be trained, e.g.:
      - Learn rate of training
      - Scaling of network (number of layers or neurons per layer)
      - Loss function
      - Minimum characteristics:
      - Description
      - Initial value
      - Final value upon communicating the results of the ML training
  - id: STD_REQ__ASPICE_40__IIC-02-01
    type: std-req
    title: "02-01 Commitment / agreement"
    status: approved
    description: |
      Commitment / agreement may have the following characteristics:
      
      - Signed off by all parties involved in the commitment/agreement
      - Establishes what the commitment is for
      - Establishes the resources required to fulfill the commitment, such as:
      - time
      - people
      - budget
      - equipment
      - facilities
  - id: STD_REQ__ASPICE_40__IIC-03-06
    type: std-req
    title: "03-06 Process performance information"
    status: approved
    description: |
      Process performance information may have the following characteristics:
      
      - Measurements about defined quantitative or qualitative measurable indicators, that match defined information needs.
      - Measurement metrics for the calculation of the quantitatively or qualitatively measurable indicators
      - Data comparing process performance against expected levels
      - Examples for project performance information:
      - resource utilization against established target
      - time schedule against established target
      - activity or task completion criteria met
      - defined input and output work products available
      - process quality against quality expectations and/or criteria
      - product quality against quality expectations and/or criteria
      - highlight product performance issues, trends
      - Examples for service level performance information:
      - references any goals established
      - real time metrics related to aspects such as:
      - capacity
      - throughput
      - operational performance
      - operational service
      - service outage time
      - up time
      - job run time
  - id: STD_REQ__ASPICE_40__IIC-03-50
    type: std-req
    title: "03-50 Verification Measure Data"
    status: approved
    description: |
      Verification Measure Data may have the following characteristics:
      
      - Verification measure data are data recorded during the execution of a
      verification measure, e.g.:
      
      - for test cases: raw data, logs, traces, tool generated outputs
      - measurements: values
      - calculations: values
      - simulations: protocol
      - reviews such as optical inspections à findings record
      - analyses: values
  - id: STD_REQ__ASPICE_40__IIC-03-51
    type: std-req
    title: "03-51 ML data set"
    status: approved
    description: |
      - Selection of ML Data for e.g., ML model training (ML Training and Validation Data Set) or test of the trained and deployed ML model (ML Test Data Set).
  - id: STD_REQ__ASPICE_40__IIC-03-53
    type: std-req
    title: "03-53 ML data"
    status: approved
    description: |
      - Datum to be used for Machine Learning. The datum has to be attributed by metadata, e.g., unique ID and data characteristics. Examples:
      - Visual data like a photo or videos (but a video could also be considered as sequence of photos depending on the intended use)
      - Audio recording
      - Sensor data
      - Data created by an algorithm
      - Data might be processed to create additional data. E.g., processing could add noise, change colors or merge pictures.
  - id: STD_REQ__ASPICE_40__IIC-04-02
    type: std-req
    title: "04-02 Domain architecture"
    status: approved
    description: |
      Definition not available yet in PAM4.0 document.
  - id: STD_REQ__ASPICE_40__IIC-04-04
    type: std-req
    title: "04-04 Software Architecture"
    status: approved
    description: |
      Software Architecture may have the following characteristics:
      
      - A justifying rationale for the chosen architecture.
      - Individual functional and non-functional behavior of the software
      component
      - Settings for application parameters (being a technical implementation
      solution for configurability-oriented requirements)
      - Technical characteristics of interfaces for relationships between software components such as:
      
      - Synchronization of Processes and tasks
      - Programming language call
      - APIs
      - Specifications of SW libraries
      - Method definitions in an object- oriented class definitions or
      UML/SysML interface classes
      - Callback functions, “hooks”
      
      - Dynamics of software components and software states such as:
      
      - Logical software operating modes (e.g, start-up, shutdown, normal
      mode, calibration, diagnosis, etc.)
      - intercommunication (processes, tasks, threads) and priority
      - time slices and cycle time
      - interrupts with their priorities
      - interactions between software components
      
      - Explanatory annotations, e.g, with natural language, for single elements
      or entire diagrams/models.
  - id: STD_REQ__ASPICE_40__IIC-04-05
    type: std-req
    title: "04-05 Software detailed design"
    status: approved
    description: |
      Software detailed design may have the following characteristics:
      
      - Elements of a software detailed design:
      
      - Control flow definition
      - Format of input/output data
      - Algorithms
      - Defined data structures
      - Justified global variables
      - Explanatory annotations, e.g, with natural language, for single
      elements or entire diagrams/models
      
      - Examples for expression languages, depending on the complexity or criticality of a software unit:
      
      - natural language or informal languages
      - semi-formal languages (e.g, UML, SysML)
      - formal languages (e.g, model-based approach)
  - id: STD_REQ__ASPICE_40__IIC-04-51
    type: std-req
    title: "04-51 ML architecture"
    status: approved
    description: |
      - An ML architecture is basically a special part of a software architecture (see 04-04). Additionally
      
      - ML architecture describes the overall structure of the ML-based software element
      - ML architecture specifies ML architectural elements including an ML model and other ML architectural elements, provided to train, deploy, and test the ML model.
      - describes interfaces within the ML-based software element and to other software elements
      - ML architecture describes details of the ML model like used layers, activation functions, loss function, and backpropagation
      - ML architecture contains defined hyperparameter ranges and initial values for training start
      - resource consumption objectives are defined
      - ML architecture contains allocated ML requirements
  - id: STD_REQ__ASPICE_40__IIC-06-04
    type: std-req
    title: "06-04 Training material"
    status: approved
    description: |
      Training material may have the following characteristics:
      
      - Updated and available for new releases
      - Coverage of system, application, operations, maintenance as appropriate to the application
      - Course listings and availability
  - id: STD_REQ__ASPICE_40__IIC-06-50
    type: std-req
    title: "06-50 Integration Sequence Instruction"
    status: approved
    description: |
      Integration Sequence Instruction may have the following characteristics:
      
      - Identification of required physical elements (e.g., hardware,
      mechanical, wiring elements), and software executables and
      application parameters (being a technical implementation solution for
      configurability-oriented requirements)
      - necessary sequence or ordering of integration
      - preconditions for starting system integration
  - id: STD_REQ__ASPICE_40__IIC-06-51
    type: std-req
    title: "06-51 Tailoring guideline"
    status: approved
    description: |
      Tailoring guideline may have the following characteristics:
      
      - Criteria for tailoring,
      - Proceeding of tailoring describing how to derive and document the defined process from the standard process
      including responsibility for tailoring and corresponding approval
      - Requirements for the defined process to ensure integrity and consistency of the defined process
      - Subset of process assets that is essential for the defined process
  - id: STD_REQ__ASPICE_40__IIC-06-52
    type: std-req
    title: "06-52 Backup and recovery mechanism information"
    status: approved
    description: |
      Backup and recovery mechanism information may have the following characteristics:
      
      - Description / confirmation of existing backup and recovery mechanisms
      - References to corresponding procedures or regulations
  - id: STD_REQ__ASPICE_40__IIC-07-04
    type: std-req
    title: "07-04 Process metric"
    status: approved
    description: |
      Process metric may have the following characteristics:
      
      - Measurements about the process' performance:
      - ability to produce sufficient work products
      - adherence to the process
      - time it takes to perform process
      - defects related to the process
      - Measures the impact of process change
      - Measures the efficiency of the process
  - id: STD_REQ__ASPICE_40__IIC-07-05
    type: std-req
    title: "07-05 Project metric"
    status: approved
    description: |
      Project metric may have the following characteristics:
      
      - Monitors key processes and critical tasks, provides status information to the project on:
      - project performance against established plan
      - resource utilization against established plan
      - time schedule against established plan
      - process quality against quality expectations and/or criteria
      - product quality against quality expectations and/or criteria
      - highlight product performance problems, trends
      - Measures the results of project activities:
      - tasks are performed on schedule
      - product's development is within the resource commitments allocated
      - References any goals established
  - id: STD_REQ__ASPICE_40__IIC-07-06
    type: std-req
    title: "07-06 Quality metric"
    status: approved
    description: |
      Quality metric may have the following characteristics:
      
      - Measures quality attributes of the work products defined:
      - functionality
      - reliability
      - usability
      - efficiency
      - maintainability
      - portability
      - Measures quality attributes of the "end customer" quality perception
      
      .. note::
      
      Refer ISO/IEC 25010 for detailed information on measurement of product quality.
  - id: STD_REQ__ASPICE_40__IIC-07-08
    type: std-req
    title: "07-08 Service level metric"
    status: approved
    description: |
      Service level metric may have the following characteristics:
      
      - Real time metrics taken while a system is operational, it measures the system's performance or expected service level
      - Identifies aspects such as:
      - capacity
      - throughput
      - operational performance
      - operational service
      - service outage time
      - up time
      - job run time
  - id: STD_REQ__ASPICE_40__IIC-07-51
    type: std-req
    title: "07-51 Measurement result"
    status: approved
    description: |
      Measurement result may have the following characteristics:
      
      Result of gathering qualitative or quantitative data, e.g.,
      - Process metric
      - Measurements about the process' performance:
      -- ability to produce sufficient work products
      -- adherence to the process
      -- time it takes to perform process
      -- defects related to the process
      - Measures the impact of process change
      - Measures the efficiency of the process
      - Project metric
      - Monitors key processes and critical tasks, provides status information to the project on:
      -- project performance against established plan
      -- resource utilization against established plan
      -- time schedule against established plan
      -- process quality against quality expectations and/or criteria
      -- product quality against quality expectations and/or criteria
      -- highlight product performance problems, trends
      - Measures the results of project activities:
      - tasks are performed on schedule
      - product's development is within the resource commitments allocated
      - References any goals established
      - Quality metric
      - Measures quality attributes of the work products defined:
      -- functionality
      -- reliability
      -- usability
      -- efficiency
      -- maintainability
      -- portability
      - Measures quality attributes of the "end customer" quality perceptionService level metric
      - Benchmarking data
      - Customer satisfaction survey
  - id: STD_REQ__ASPICE_40__IIC-07-61
    type: std-req
    title: "07-61 Quantitative process metric"
    status: approved
    description: |
      Quantitative process metric may have the following characteristics:
      
      - Quantitatively measurable indicators that match information needs derived from business goals
      - Relation of the quantitatively measurable indicators to process elements in process descriptions
      or repositories and tools
      - Process measurement metrics for the calculation of the quantitatively measurable indicators,
      sbased on data from related process elements, repositories, or tools
  - id: STD_REQ__ASPICE_40__IIC-07-62
    type: std-req
    title: "07-62 Process analysis technique"
    status: approved
    description: |
      Process analysis technique may have the following characteristics:
      
      - Methods for statistical analysis of process data
      - Frequency of data collection.
  - id: STD_REQ__ASPICE_40__IIC-07-63
    type: std-req
    title: "07-63 Process control limits"
    status: approved
    description: |
      Process control limits may have the following characteristics:
      
      - Quantitative control limits for the quantitative process metrics
  - id: STD_REQ__ASPICE_40__IIC-07-64
    type: std-req
    title: "07-64 Process measurement data"
    status: approved
    description: |
      Process measurement data may have the following characteristics:
      
      - Data collected across process instances
      - Attributes of data, e.g., timestamps
      - Relation to process measurement metrics
      - Storage and retrieval
      - Effective controls over access
  - id: STD_REQ__ASPICE_40__IIC-08-53
    type: std-req
    title: "08-53 Scope of work"
    status: approved
    description: |
      Scope of work may have the following characteristics:
      
      - Summary of deliverables for a project
      - Intended use for the deliverables
      - Main functions to be realized
      - Target delivery date and major milestones
      - Work products and activities that are not in scope of the project as needed
      - Target markets
      - Applicable standards and legal requirements
      - Reuse options
      - Integration of third party deliveries
  - id: STD_REQ__ASPICE_40__IIC-08-54
    type: std-req
    title: "08-54 Feasibility analysis"
    status: approved
    description: |
      Feasibility analysis may have the following characteristics:
      
      - Statement about the ability of the project to achieve
      the project objectives with available resources
  - id: STD_REQ__ASPICE_40__IIC-08-55
    type: std-req
    title: "08-55 Risk measure"
    status: approved
    description: |
      Risk measure may have the following characteristics:
      
      - Identifies
      - the risk to be mitigated, avoided, or shared (transferred)
      - the activities to mitigate, avoid, or share (transfer) the risk
      - the originator of the measure
      - criteria for successful implementation
      - criteria for cancellation of activities
      - frequency of monitoring
      - Risk treatment alternatives:
      - treatment option selected- avoid/reduce/transfer
      - alternative descriptions
      - recommended alternative(s)
      - justifications
  - id: STD_REQ__ASPICE_40__IIC-08-56
    type: std-req
    title: "08-56 Schedule"
    status: approved
    description: |
      Schedule may have the following characteristics:
      
      - Identifies the activities to be performed
      - Identifies the expected, and actual, start and completion date for required activities against progress/completion of activities
      - Identifies dependencies between activities and critical path
      - Has a mapping to scheduled resources and input data
      - Identifies resource allocation, resource workload, and critical resources
      
      .. note::
      
      A schedule is consistent with the defined work packages, see 14-10
  - id: STD_REQ__ASPICE_40__IIC-08-58
    type: std-req
    title: "08-58 Verification Measure Selection Set"
    status: approved
    description: |
      Verification Measure Selection Set may have the following characteristics:
      
      - Include criteria for re-verification in the case of changes (regression).
      - Identification of verification measures, also for regression testing.
  - id: STD_REQ__ASPICE_40__IIC-08-60
    type: std-req
    title: "08-60 Verification Measure"
    status: approved
    description: |
      Verification Measure may have the following characteristics:
      
      - A verification measure can be a test case, a measurement, a
      calculation, a simulation, a review, an optical inspection, or an analysis
      - The specification of a verification measure includes
      
      - pass/fail criteria for verification measures (test completion and ending criteria)
      - a definition of entry and exit criteria for the verification measures, and abort and re-start criteria
      
      - Techniques (e.g., black-box and/or white-box-testing, equivalence
      classes and boundary values, fault injection for Functional Safety,
      penetration testing for Cybersecurity, back-to-back testing for model-based development, ICT)
      - Necessary verification environment & infrastructure
      - Necessary sequence or ordering
  - id: STD_REQ__ASPICE_40__IIC-08-61
    type: std-req
    title: "08-61 Resource allocation"
    status: approved
    description: |
      Resource allocation may have the following characteristics:
      
      - Detailed / named resources are allocated to process tasks
      - Overall resource workload is considered (e.g., allocation of resources to multiple projects)
      
      .. note::
      
      Work breakdown structure may be used to refine the detailed resource allocation
      
      .. note::
      
      A resource allocation may be integrated in a/ be a part of the schedule, see 08-56
      
      .. note::
      
      Resources to be allocated are e.g., personnel/human resources for project roles and physical and material resources such as (special/limited) equipment, tool, licenses, test hardware, test vehicle, climate chambers etc.
  - id: STD_REQ__ASPICE_40__IIC-08-62
    type: std-req
    title: "08-62 Communication matrix"
    status: approved
    description: |
      Communication matrix may have the following characteristics:
      
      - List of relevant process internal / external stakeholders
      - Roles and contact information of the parties involved
      - Definition of required interfaces between stakeholders
      - Communication subject
      - Communication means and frequency
      - Documentation needs of the communication (e.g., type of communication record)
  - id: STD_REQ__ASPICE_40__IIC-08-63
    type: std-req
    title: "08-63 Process Monitoring Method"
    status: approved
    description: |
      Process Monitoring Method may have the following characteristics:
      
      - Measures including criteria for monitoring effectiveness, suitability, and adequacy of the standard process
      - Method for collecting and analyzing the monitoring measures
  - id: STD_REQ__ASPICE_40__IIC-08-64
    type: std-req
    title: "08-64 ML test approach"
    status: approved
    description: |
      - The ML test approach describes
      - ML test scenarios with distribution of data characteristics (e.g., gender, weather conditions, street conditions within the ODD) defined by ML requirements
      - quantity of each ML test scenario inside the test data set
      - expected test result per test datum
      - pass/fail criteria for the ML testing
      - entry and exit criteria for the ML testing
      - the required ML testing infrastructure and environment configuration
  - id: STD_REQ__ASPICE_40__IIC-08-65
    type: std-req
    title: "08-65 ML training and validation approach"
    status: approved
    description: |
      Process Monitoring Method may have the following characteristics:
      
      - ML Training and Validation approach describes at least:
      - entry and exit criteria of the ML training
      - approaches for hyperparameter tuning / optimization to be used in the training
      - approach for data set creation and modification
      - training environment, including required training hardware (e.g., GPU, or supercomputer to be used)
      - interface adapter for provision of input data and storage of output data
      - if required, actions to organize the data set and training environment
      - The ML training and validation approach may additionally include robustification methods like random dropout
  - id: STD_REQ__ASPICE_40__IIC-08-66
    type: std-req
    title: "08-66 Measures against deviations in quantitative process analysis"
    status: approved
    description: |
      Measures against deviations in quantitative process analysis may have the following characteristics:
      
      - Definition of counter measures actions to address each assignable cause of special causes of variation,
      or common causes of variation
      - Effective implementation of these counter measures
  - id: STD_REQ__ASPICE_40__IIC-10-00
    type: std-req
    title: "10-00 Process description"
    status: approved
    description: |
      Process description may have the following characteristics:
      
      - Process description of a standard or defined process (e.g., after tailoring), including:
      - scope and the intended use of the process
      - process activities including description and dependencies
      - entry and exit criteria such as input information needed and expected outputs for activities
      - Roles assigned to process activities (e.g., as RASIC ) or work products
      - guidelines
      - templates
      - specific methods/work instructions
  - id: STD_REQ__ASPICE_40__IIC-10-50
    type: std-req
    title: "10-50 Role description"
    status: approved
    description: |
      Role description may have the following characteristics:
      
      - Name/identifier (unique within the organization)
      - Assigned activities (e.g., as RASIC)
      - Responsibilities and authorities
      - Required competencies, skills, and experience
  - id: STD_REQ__ASPICE_40__IIC-10-51
    type: std-req
    title: "10-51 Qualification method description"
    status: approved
    description: |
      Qualification method description may have the following characteristics:
      
      - Training courses
      - Training materials
      - Mentoring/coaching concepts
      - Self-learning material
  - id: STD_REQ__ASPICE_40__IIC-10-52
    type: std-req
    title: "10-52 Process resource and infrastructure description"
    status: approved
    description: |
      Process resource and infrastructure description may have the following characteristics:
      
      - Required facilities
      - Required tools and corresponding licenses
      - Required networks
      - Required services
      - Required samples
  - id: STD_REQ__ASPICE_40__IIC-11-03
    type: std-req
    title: "11-03 Release note"
    status: approved
    description: |
      Release note may have the following characteristics:
      
      - Coverage for key elements (as appropriate to the application):
      - Description of what is new or changed (including features removed)
      - System information and requirements
      - Identification of conversion programs and instructions
      - Release numbering implementation may include:
      - the major release number
      - the feature release number
      - the defect repair number
      - the alpha or beta release; and the iteration within the alpha or beta release
      - Identification of the component list (version identification included):
      - hardware / software / product elements, libraries, etc.
      - associated documentation list
      - New/changed parameter information (e.g., for application parameters or global variables) and/or commands.
      Note that application parameters are a technical implementation solution for configurability-oriented requirements)
      - Backup and recovery information
      - List of open known problems, faults, warning information, etc.
      - Identification of verification and diagnostic procedures
      - Technical support information
      - Copyright and license information
      - The release note may include an introduction, the environmental requirements, installation procedures, product invocation,
      new feature identification and a list of defect resolutions, known defects and workarounds
  - id: STD_REQ__ASPICE_40__IIC-11-04
    type: std-req
    title: "11-04 Product release package"
    status: approved
    description: |
      Product release package may have the following characteristics:
      
      - Includes the hardware/software/product
      - Includes and associated release elements such as:
      - system hardware/software/product elements
      - associated customer documentation
      - application parameter definitions defined
      - command language defined
      - installation instructions
      - release letter
  - id: STD_REQ__ASPICE_40__IIC-11-05
    type: std-req
    title: "11-05 Software Unit"
    status: approved
    description: |
      Software Unit may have the following characteristics:
      
      - a representation of a software element at the lowest level in a
      conceptual model, which is decided not to be further subdivided and
      that is a part of a software component, or
      - a representation of a software unit under verification such as
      commented source code, auto-code, an object file, a library, an
      executable, or an executable model as input to verification
  - id: STD_REQ__ASPICE_40__IIC-11-50
    type: std-req
    title: "11-50 Deployed ML model"
    status: approved
    description: |
      -  It is derived from the trained ML model (see 01-53) and is to be integrated into the target system.
      - It may differ from the trained ML model which often requires powerful hardware and uses interpretative languages.
  - id: STD_REQ__ASPICE_40__IIC-12-03
    type: std-req
    title: "12-03 Reuse candidate"
    status: approved
    description: |
      Reuse candidate may have the following characteristics:
      
      - Identifies the product to be reused
      - Identifies the responsible person for the products to be reused
      - Identifies the reuse goals and objectives
      - Identifies the list of reuse assets
      - Identifies the issues/risks of reusing the component including specific requirements
      (hardware, software, resource and other reuse components)
      - Identifies the person who will be qualifying the reuse candidate
  - id: STD_REQ__ASPICE_40__IIC-13-06
    type: std-req
    title: "13-06 Delivery evidence"
    status: approved
    description: |
      Delivery evidence may have the following characteristics:
      
      - Evidence of items shipped/delivered electronically to customer
      - Identification of:
      - to whom it was sent
      - address, where delivered
      - delivery date
      - receipt of delivered product
  - id: STD_REQ__ASPICE_40__IIC-13-07
    type: std-req
    title: "13-07 Problem"
    status: approved
    description: |
      Problem may have the following characteristics:
      
      - Identifies the submitter of the problem
      - Identifies the group/person(s) responsible for providing problem resolution
      - Includes a description of the problem
      - Identifies classification of the problem (criticality, urgency, relevance etc.)
      - Identifies the status of the problem
      - States such as “open”, “in review”, “in implementation”, “closed”, “rejected”, “cancelled”, …
      - Transitions between states with conditions and authorities
      - Identifies the expected closure date
  - id: STD_REQ__ASPICE_40__IIC-13-08
    type: std-req
    title: "13-08 Baseline"
    status: approved
    description: |
      Baseline may have the following characteristics:
      
      - Identifies a state of one or a set of work products and artifacts which are consistent and complete
      - Basis for next process steps and/or delivery
      - Is unique and may not be changed
      
      .. note::
      
      This should be established before a release to identify consistent and complete delivery
  - id: STD_REQ__ASPICE_40__IIC-13-09
    type: std-req
    title: "13-09 Meeting support evidence"
    status: approved
    description: |
      Meeting support evidence may have the following characteristics:
      
      - Agenda and minutes that are records that define:
      - purpose of meeting
      - attendees
      - date, place held
      - reference to previous minutes
      - what was accomplished
      - identifies issues raised
      - any open issues
      - next meeting if any
  - id: STD_REQ__ASPICE_40__IIC-13-13
    type: std-req
    title: "13-13 Product release approval"
    status: approved
    description: |
      Product release approval support evidence may have the following characteristics:
      
      - Content information of what is to be shipped or delivered
      - Identification of:
      - for whom it is intended
      - the address where to deliver
      - the date released
      - Evidence of supplier approval
  - id: STD_REQ__ASPICE_40__IIC-13-14
    type: std-req
    title: "13-14 Progress status"
    status: approved
    description: |
      Progress status may have the following characteristics:
      
      Status of a plan(s) (actual against planned) such as:
      - status of actual activities/work packages against planned activities/work package
      - status of actual results against established objectives/goals
      - status of actual resources allocation against planned resources
      - status of actual cost against budget estimates
      - status of actual time against planned schedule
      - status of actual quality against planned quality
      Record of any deviations from planned activities and reason why
  - id: STD_REQ__ASPICE_40__IIC-13-16
    type: std-req
    title: "13-16 Change request"
    status: approved
    description: |
      Change request may have the following characteristics:
      
      - Identifies purpose of change
      - Identifies requester contact information
      - Impacted system(s)
      - Impact to operations of existing system(s) defined
      - Impact to associated documentation defined
      - Criticality of the request, due date
      - Information supporting the tracking of change requests to closure
      - progress status attribute (e.g., open, allocated, implemented, closed)
      - time stamp of status change
      - person who changed a status
      - rationale for changing a status
  - id: STD_REQ__ASPICE_40__IIC-13-18
    type: std-req
    title: "13-18 Quality conformance evidence"
    status: approved
    description: |
      Quality conformance evidence may have the following characteristics:
      
      - Identifies what tasks/activities/process produce the information
      - Identifies when the data was collected
      - Identifies source of any associated data
      - Identifies the associated quality criteria
      - Identifies any associated measurements using the information
  - id: STD_REQ__ASPICE_40__IIC-13-19
    type: std-req
    title: "13-19 Review evidence"
    status: approved
    description: |
      Review evidence may have the following characteristics:
      
      - Provides the context information about the review:
      - what was reviewed
      - lists reviewers who attended and their area of responsibility
      - status of the review
      - Provides information about the scope of the review:
      - checklists
      - review criteria
      - requirements
      - compliance to standards
      - Effort information about:
      - preparation time spent for the review
      - time spent in the review
      - Review findings:
      - non-conformances
      - improvement suggestions
  - id: STD_REQ__ASPICE_40__IIC-13-25
    type: std-req
    title: "13-25 Verification results"
    status: approved
    description: |
      Verification results may have the following characteristics:
      
      - Verification data and logs
      - Verification measure passed
      - Verification measure not passed
      - Verification measure not executed, and a rationale
      - Information about the verification execution (date, “object-under-verification”, etc.)
      - Abstraction or summary of verification results
  - id: STD_REQ__ASPICE_40__IIC-13-50
    type: std-req
    title: "13-50 ML test results"
    status: approved
    description: |
      - Test data and logs
      - Test data with correct results
      - Test data with incorrect results
      - Test data not executed, and a rationale
      - Information about the test execution (date, participants, model version etc.)
      - Abstraction or summary of ML test results
  - id: STD_REQ__ASPICE_40__IIC-13-51
    type: std-req
    title: "13-51 Consistency Evidence"
    status: approved
    description: |
      Consistency Evidence may have the following characteristics:
      
      - Demonstrates bidirectional traceability between artifacts or information
      in artifacts, throughout all phases of the life cycle, by e.g.,
      
      - tool links
      - hyperlinks
      - editorial references
      - naming conventions
      
      - Evidence that the content of the referenced or mapped information
      coheres semantically along the traceability chain, e.g., by
      
      - performing pair working or group work
      - performing by peers, e.g., spot checks
      - maintaining revision histories in documents
      - providing change commenting (via e.g., meta-information) of
      database or repository entries
      
      .. note::
      
      This evidence can be accompanied by e.g., Definition of Done
      (DoD) approaches.
  - id: STD_REQ__ASPICE_40__IIC-13-52
    type: std-req
    title: "13-52 Communication Evidence"
    status: approved
    description: |
      Communication Evidence may have the following characteristics:
      
      - All forms of interpersonal communication such as
      
      - e-mails, also automatically generated ones
      - tool-supported workflows
      - meeting, verbally or via meeting minutes (e.g., daily standups)
      - podcast
      - blog
      - videos
      - forum
      - live chat
      - wikis
      - photo protocol
  - id: STD_REQ__ASPICE_40__IIC-13-53
    type: std-req
    title: "13-53 Qualification evidence"
    status: approved
    description: |
      Definition not available yet in PAM4.0 document.
  - id: STD_REQ__ASPICE_40__IIC-13-55
    type: std-req
    title: "13-55 Process resource and infrastructure documentation"
    status: approved
    description: |
      Process resource and infrastructure documentation may have the following characteristics:
      
      - Information on availability, allocation, and usage of
      - Facilities
      - Tools and corresponding licenses
      - Networks
      - Services
      - Samples
      - for non-standard and critical resources and infrastructure.
  - id: STD_REQ__ASPICE_40__IIC-14-01
    type: std-req
    title: "14-01 Change history"
    status: approved
    description: |
      Change history may have the following characteristics:
      
      - Historical records of all changes made to an object (document, file, software component, etc.):
      - description of change
      - version information about changed object
      - date of change
      - change requester information
      - change control record information
  - id: STD_REQ__ASPICE_40__IIC-14-02
    type: std-req
    title: "14-02 Corrective action"
    status: approved
    description: |
      Corrective action may have the following characteristics:
      
      - Identifies the initial problem
      - Identifies the ownership for completion of defined action
      - Defines a solution (series of actions to fix problem)
      - Identifies the open date and target closure date
      - Contains a status indicator
      - Indicates follow up audit actions
  - id: STD_REQ__ASPICE_40__IIC-14-10
    type: std-req
    title: "14-10 Work package"
    status: approved
    description: |
      Work package may have the following characteristics:
      
      - Defines activities to be performed
      - Documents ownership for activities e.g., by domains
      - Documents critical dependencies to other work packages
      - Documents input and output work products
      - Documents the critical dependencies between defined work products
      - Information needed to perform these activities
      - Estimates of effort, duration
      
      .. note::
      
      The work package descriptions may be integrated into the/be a part of a schedule, see 08-56
  - id: STD_REQ__ASPICE_40__IIC-14-50
    type: std-req
    title: "14-50 Stakeholder groups list"
    status: approved
    description: |
      Stakeholder groups list may have the following characteristics:
      
      Identifies:
      - involved parties
      - weight/importance of each stakeholder group
      - representative(s) for each stakeholder group
      - information needs of each stakeholder group
  - id: STD_REQ__ASPICE_40__IIC-14-53
    type: std-req
    title: "14-53 Role Assignment"
    status: approved
    description: |
      Role Assignment may have the following characteristics:
      
      - Assignment of person(s) to roles
      - required competencies vs existing competencies
      - required skills vs existing skills
      - required experience and trainings based on identified competencies / skills gap
  - id: STD_REQ__ASPICE_40__IIC-14-55
    type: std-req
    title: "14-55 Software Bill of materials"
    status: approved
    description: |
      Software Bill of materials may have the following characteristics:
      
      - Uniquely identifies type, supplier, and
      amount of the complete set of all software parts of the software
  - id: STD_REQ__ASPICE_40__IIC-15-06
    type: std-req
    title: "15-06 Project status"
    status: approved
    description: |
      Project status may have the following characteristics:
      
      - Status of in regards to progress and consistency of schedule, work item content, tasks, resources
      (human resources, infrastructure, hardware/materials, budget), skills and competence of human resources
      - planned progress and expenditure against dates/deadlines and actual expenditure
      - reasons for variance from planned progress
      - threats to continued progress
      - issues which may affect the ability of the project to achieve its goals
      - contingency actions
  - id: STD_REQ__ASPICE_40__IIC-15-07
    type: std-req
    title: "15-07 Reuse analysis evidence"
    status: approved
    description: |
      Reuse analysis evidence may have the following characteristics:
      
      - Identification of reuse opportunities
      - Identification of constraints for reuse
      - Identification of regression test cases
      - Identification of reuse infrastructure
      - Identification of known defects
  - id: STD_REQ__ASPICE_40__IIC-15-09
    type: std-req
    title: "15-09 Risk status"
    status: approved
    description: |
      Risk status may have the following characteristics:
      
      - Identifies the status, or the change, of an identified risk:
      - risk statement
      - risk source
      - risk impact and risk probability
      - categories and risk thresholds, e.g., for prioritization or setting a status
      - risk treatment activities in progress
  - id: STD_REQ__ASPICE_40__IIC-15-12
    type: std-req
    title: "15-12 Problem status"
    status: approved
    description: |
      Problem status may have the following characteristics:
      
      - Indicates progress of problem resolution
      - Status of problem e.g.,
      - by problem categories/classification
      - by problem resolution stage
  - id: STD_REQ__ASPICE_40__IIC-15-13
    type: std-req
    title: "15-13 Assessment/audit report"
    status: approved
    description: |
      Assessment/audit report may have the following characteristics:
      - States the purpose of assessment
      - Method used for assessment
      - Requirements used for the assessment
      - Assumptions and limitations
      - Identifies the context and scope information required:
      -- date of assessment
      -- organizational unit assessed
      -- sponsor information
      -- assessment team
      -- attendees
      -- scope/coverage
      -- assesses and information
      -- assessment tool used
      - Records the result:
      -- Data
      -- identifies the gaps, potentials, weaknesses or non-conformances that require corrective actions
  - id: STD_REQ__ASPICE_40__IIC-15-16
    type: std-req
    title: "15-16 Improvement opportunity"
    status: approved
    description: |
      Improvement opportunity may have the following characteristics:
      
      - Identifies what the problem is
      - Identifies what the cause of a problem is
      - Suggest what could be done to fix the problem
      - Identifies the value (expected benefit) in performing the improvement
      - Identifies the penalty for not making the improvement
  - id: STD_REQ__ASPICE_40__IIC-15-51
    type: std-req
    title: "15-51 Analysis Results"
    status: approved
    description: |
      Analysis Results may have the following characteristics:
      
      - Identification of the object under analysis
      - The analysis criteria used, e.g.:
      
      - selection criteria or prioritization scheme used
      - decision criteria
      - quality criteria
      
      - The analysis results, e.g.:
      
      - what was decided/selected
      - reason for the selection
      - assumptions made
      - potential negative impact
      
      - Aspects of the analysis may include
      
      - correctness
      - understandability
      - verifiability
      - feasibility
      - validity
  - id: STD_REQ__ASPICE_40__IIC-15-52
    type: std-req
    title: "15-52 Verification Results"
    status: approved
    description: |
      Verification Results may have the following characteristics:
      
      - Verification data and logs
      - Verification measure passed
      - Verification measure not passed
      - Verification measure not executed
      - Information about the test execution (date, tester name etc.)
      - Abstraction or summary of verification results
  - id: STD_REQ__ASPICE_40__IIC-15-54
    type: std-req
    title: "15-54 Tailoring documentation"
    status: approved
    description: |
      Tailoring documentation results may have the following characteristics:
      
      - Applied criteria for tailoring,
      - Evidence that the defined process is tailored from the standard process according
      to the defined criteria
  - id: STD_REQ__ASPICE_40__IIC-15-55
    type: std-req
    title: "15-55 Problem analysis evidence"
    status: approved
    description: |
      Problem analysis evidence may have the following characteristics:
      
      - Author and involved parties
      - Date of the analysis
      - Context and root cause of the problem
      - Analysis result may include
      - Impact
      - Potential negative impact
      - Affected parties
      - Potential solution (if known)
  - id: STD_REQ__ASPICE_40__IIC-15-56
    type: std-req
    title: "15-56 Configuration status"
    status: approved
    description: |
      Configuration status may have the following characteristics:
      
      - Summary of configuration management records including relevant status
      - Analysis of the configuration management overall state
      - Identification of baselines made
  - id: STD_REQ__ASPICE_40__IIC-15-57
    type: std-req
    title: "15-57 Quantitative process analysis results"
    status: approved
    description: |
      Quantitative process analysis results may have the following characteristics:
      
      - Deviations, and distributions, of the quantitative performance of individual process instances performance
      from the established quantitative control limits (special causes of variations)
  - id: STD_REQ__ASPICE_40__IIC-15-58
    type: std-req
    title: "15-58 Common cause of variation analysis results"
    status: approved
    description: |
      Common cause of variation analysis results may have the following characteristics:
      
      - Identification of common causes
      - deviations of the quantitative performance of all process instances
      from the established quantitative control limits
      - distributions of the quantitative performance of all process instances
      within established quantitative control limits
  - id: STD_REQ__ASPICE_40__IIC-16-00
    type: std-req
    title: "16-00 Repository"
    status: approved
    description: |
      Repository may have the following characteristics:
      
      Charcteristics according to Wikipedia, as the PAM 4.0 is lacking it in the IIC.
      A software repository, or repo for short, is a storage location for software packages.
      Often a table of contents is also stored, along with metadata.
      A software repository is typically managed by source or version control, or repository managers.
      Package managers allow automatically installing and updating repositories, sometimes called "packages".
  - id: STD_REQ__ASPICE_40__IIC-16-03
    type: std-req
    title: "16-03 Configuration management system"
    status: approved
    description: |
      Configuration management system may have the following characteristics:
      
      - Supports the configuration management for the scope of the configuration item list contents
      - Correct configuration of products
      - Can recreate any release or test configuration
      - Ability to report configuration status
      - Has to cover all relevant tools
  - id: STD_REQ__ASPICE_40__IIC-16-06
    type: std-req
    title: "16-06 Process repository"
    status: approved
    description: |
      Process repository may have the following characteristics:
      
      - Contains process descriptions
      - Supports multiple presentations of process assets
  - id: STD_REQ__ASPICE_40__IIC-16-50
    type: std-req
    title: "16-50 Organizational structure"
    status: approved
    description: |
      Organizational structure may have the following characteristics:
      
      - Disciplinary reporting line
      - Organizational units and sub-units, if applicable
  - id: STD_REQ__ASPICE_40__IIC-16-52
    type: std-req
    title: "16-52 ML data management system"
    status: approved
    description: |
      - The ML data management system is part of the configuration management system (see 16-03) and
      - Supports data management activities like data collection, description, ingestion, exploration, profiling, labeling/annotation, selection, structuring and cleansing
      - Provides the data for different purposes, e.g., training, testing
      - Supports the relevant sources of ML data
  - id: STD_REQ__ASPICE_40__IIC-17-00
    type: std-req
    title: "17-00 Requirement"
    status: approved
    description: |
      Requirements may have the following characteristics:
      
      - An expectation of functions and capabilities (e.g., non-functional
      requirements), or one of its interfaces
      - from a black-box perspective
      - that is verifiable, does not imply a design or implementation decision, is
      unambiguous, and does not introduce contradictions to other
      requirements.
      - A requirements statement that implies, or represents, a design or
      implementation decision is called “Design Constraint”.
      - Examples for requirements aspects at the system level are thermal
      characteristics such as
      
      - heat dissipation
      - dimensions
      - weight
      - materials
      
      - Examples of aspects related to requirements about system interfaces
      are
      
      - connectors
      - cables
      - housing
      
      - Examples for requirements at the hardware level are
      
      - lifetime and mission profile, lifetime robustness
      - maximum price
      - storage and transportation requirements
      - functional behavior of analog or digital circuits and logic
      - quiescent current, voltage impulse responsiveness to crank, startstop, drop-out, load dump
      - temperature, maximum hardware heat dissipation
      - power consumption depending on the operating state such as
      sleep-mode, start-up, reset conditions
      - frequencies, modulation, signal delays, filters, control loops
      - power-up and power-down sequences, accuracy and precision of
      signal acquisition or signal processing time
      - computing resources such as memory space and CPU clock
      tolerances
      - maximum abrasive wear and shearing forces for e.g., pins or
      soldering joints
      - requirements resulting from lessons learned
      - safety related requirements derived from the technical safety
      concept
  - id: STD_REQ__ASPICE_40__IIC-17-05
    type: std-req
    title: "17-05 Requirements for work products"
    status: approved
    description: |
      Requirements for work products may have the following characteristics:
      
      - Requirements for content and structure, storage and control
      - Identifies documentation specific meta data, such as id, date, author information, ownership, access rights, review and approval status with, where applicable, status model and workflow, or others
      - Identifies requirements on documentation structure, e.g., table of content or figures or other formal aspects
      - May be provided by documentation templates
      - May be based on tool specific templates
      - Defines the storage location such as data repository, tool, versioning system
      - Requirements for versioning
      - Requirements for baselining
      - Distribution of the documents
      - Maintenance and disposal of the documents
      - May be specific for certain types of documents
  - id: STD_REQ__ASPICE_40__IIC-17-54
    type: std-req
    title: "17-54 Requirement Attribute"
    status: approved
    description: |
      Requirement Attributes may have the following characteristics:
      
      - Meta-attributes that support structuring and definition of release scopes
      of requirements.
      - Can be realized by means of tools.
      
      .. note::
      
      usage of requirements attributes may further support analysis of
      requirements.
  - id: STD_REQ__ASPICE_40__IIC-17-55
    type: std-req
    title: "17-55 Resource needs"
    status: approved
    description: |
      Resource needs may have the following characteristics:
      
      - Identification of required resources for process performance
      - Staff including competencies, skills and authorities needs
      - Material, equipment, and infrastructure
      - Time and budget
      
      .. note::
      
      Needs are derived from Work Breakdown structure and schedule
  - id: STD_REQ__ASPICE_40__IIC-18-00
    type: std-req
    title: "18-00 Standard"
    status: approved
    description: |
      Standard may have the following characteristics:
      
      - Identification of to whom/what they apply
      - Expectations for conformance are identified
      - Conformance to requirements can be demonstrated
      - Provisions for tailoring or exception to the requirements are included
  - id: STD_REQ__ASPICE_40__IIC-18-06
    type: std-req
    title: "18-06 Product release criteria"
    status: approved
    description: |
      Product release criteria may have the following characteristics:
      
      - Defines expectations for product release:
      - release type and status
      - required elements of the release
      - product completeness including documentation
      - adequacy and coverage of testing
      - limit for open defects
      - change control status
  - id: STD_REQ__ASPICE_40__IIC-18-07
    type: std-req
    title: "18-07 Quality criteria"
    status: approved
    description: |
      Quality criteria may have the following characteristics:
      
      - Defines the expectations for work products and process performance
      - Including thresholds/tolerance levels, required measurements, required checkpoints
      - Defines what is an adequate work product (required elements, completeness expected, accuracy, etc.)
      - Defines what constitutes the completeness of the defined tasks
      - Defines what constitutes the performance of the defined tasks
      - Establishes expected performance attributes
  - id: STD_REQ__ASPICE_40__IIC-18-52
    type: std-req
    title: "18-52 Escalation path"
    status: approved
    description: |
      Escalation path may have the following characteristics:
      
      - Defined mechanisms to report and confirm escalation relevant issues
      - Identifies stakeholders to be included in the escalation path
      - Identifies levels of escalation
  - id: STD_REQ__ASPICE_40__IIC-18-53
    type: std-req
    title: "18-53 Configuration item selection criteria"
    status: approved
    description: |
      Configuration item selection criteria may have the following characteristics:
      
      - Identify types of work products to be subject to configuration control
  - id: STD_REQ__ASPICE_40__IIC-18-57
    type: std-req
    title: "18-57 Change analysis criteria"
    status: approved
    description: |
      Change analysis criteria may have the following characteristics:
      
      - Defines analysis criteria, such as
      - resource requirements
      - scheduling issues
      - risks
      - benefits
  - id: STD_REQ__ASPICE_40__IIC-18-58
    type: std-req
    title: "18-58 Process performance objectives"
    status: approved
    description: |
      Process performance objectives may have the following characteristics:
      
      - Objectives for the process of creating the process outcomes and capability level 2 achievements, and corresponding evaluation criteria
      - Assumptions and constraints, if applicable
      - Used as the basis for deriving a detailed planning
      - Examples:
      - Effort, costs, or budget targets (e.g., min/max limits)
      - Process-specific deadlines in line with milestones, or frequency of activities (o e.g., dates for deliveries to the customer, quality gates)
      - Metrics (e.g., max. number of open change requests per release, max. ratio of configuration items in status “in work” at certain milestones before next delivery / release date)
  - id: STD_REQ__ASPICE_40__IIC-18-59
    type: std-req
    title: "18-59 Review and approval criteria for work products"
    status: approved
    description: |
      Process performance objectives may have the following characteristics:
      
      - Specifies for each type of work products review and approval needs
      - If and when a review is required
      - Who shall review it
      - Who shall approve it
      - Review method(s) to be used
      - Criteria for approval
  - id: STD_REQ__ASPICE_40__IIC-18-70
    type: std-req
    title: "18-70 Business goals"
    status: approved
    description: |
      Business goals may have the following characteristics:
      
      - Explanation of the business goals
      - Requirements for the business needs
      - Associations to other goals
      - Reasons for the existence of the goals and needs, level of degree of the need and effect on the business not having that need
      - Conditions, constraints, assumptions
      - Timeframe for achievement
      - Authorization at the highest level
  - id: STD_REQ__ASPICE_40__IIC-18-80
    type: std-req
    title: "18-80 Improvement opportunity"
    status: approved
    description: |
      Improvement opportunity may have the following characteristics:
      
      - Cause of the improvement need, e.g.,
      - from qualitative or quantitative process performance analysis, evaluations, and monitoring
      - industry best practice review, state-of-the-art observations, market studies etc.
      - Improvement objectives derived from organizational business goals and improvement needs
      - Organizational scope
      - Process scope
      - Activities to be performed to keep all those affected by the improvement informed
      - Priorities
  - id: STD_REQ__ASPICE_40__IIC-18-81
    type: std-req
    title: "18-81 Improvement evaluation results"
    status: approved
    description: |
      Improvement evaluation results may have the following characteristics:
      
      - Operational impacts of identified changes on the product(s) and processes
      - Expected benefit
      - Conditions, constraints, assumptions
  - id: STD_REQ__ASPICE_40__IIC-19-01
    type: std-req
    title: "19-01 Process performance strategy"
    status: approved
    description: |
      Process performance strategy may have the following characteristics:
      
      - The operational approach to achieve the process outcomes, consistent with the Process Performance Objectives (18-58), e.g.:
      - proceedings, including the monitoring of the performance of the process
      - methodology
      - scope(s) of the strategy within the process, e.g.:
      - development sites
      - application domain-specific differences (e.g., software drivers versus. powertrain software)
      - disciplines (e.g., different configuration management approaches for software and hardware, or combined approaches)
      - options due to socio-cultural differences
  - id: STD_REQ__ASPICE_40__IIC-19-50
    type: std-req
    title: "19-50 ML data quality approach"
    status: approved
    description: |
      - The ML data quality approach
      - Defines Quality criteria (see 18-07) e.g., the relevant data sources, reliability and consistency of labelling, completeness against ML data requirements
      - Describes analysis activities of the data
      - Describes activities to ensure the quality of the data to avoid issues e.g., data bias, bad labeling
  - id: STD_REQ__ASPICE_40__MAN-3-BP1
    type: std-req
    title: "MAN.3.BP1: Define the scope of work"
    status: approved
    description: |
      Identify the project's goals, motivation and boundaries.
    fields:
      links: std_req__aspice_40__iic-08-53
  - id: STD_REQ__ASPICE_40__MAN-3-BP2
    type: std-req
    title: "MAN.3.BP2: Define project life cycle"
    status: approved
    description: |
      Define the life cycle for the project, which is appropriate to the scope, context, and
      complexity of the project. Define a release scope for relevant milestones.
      
      .. note::
      
      This may include the alignment of the project life cycle with the customer's development process.
    fields:
      links: "std_req__aspice_40__iic-08-53,std_req__aspice_40__iic-08-54,std_req__aspice_40__iic-13-51,std_req__aspice_40__iic-13-52"
  - id: STD_REQ__ASPICE_40__MAN-3-BP3
    type: std-req
    title: "MAN.3.BP3: Evaluate feasibility of the project"
    status: approved
    description: |
      Evaluate the feasibility of achieving the goals of the project with respect to time, project estimates, and available resources.
      
      .. note::
      
      The evaluation of feasibility may consider technical constraints of the project.
    fields:
      links: "std_req__aspice_40__iic-08-54,std_req__aspice_40__iic-13-51,std_req__aspice_40__iic-13-52"
  - id: STD_REQ__ASPICE_40__MAN-3-BP4
    type: std-req
    title: "MAN.3.BP4: Define and monitor work packages"
    status: approved
    description: |
      Define and monitor work packages and their dependencies according to defined project life cycle and estimations.
      
      .. note::
      
      The structure and the size of the work packages support an adequate progress monitoring.
      
      .. note::
      
      Work packages may be organized in a work breakdown structure.
    fields:
      links: "std_req__aspice_40__iic-08-54,std_req__aspice_40__iic-08-56,std_req__aspice_40__iic-13-16,std_req__aspice_40__iic-13-51,std_req__aspice_40__iic-13-52,std_req__aspice_40__iic-14-02,std_req__aspice_40__iic-14-10,std_req__aspice_40__iic-14-50,std_req__aspice_40__iic-15-06,std_req__aspice_40__iic-18-52"
  - id: STD_REQ__ASPICE_40__MAN-3-BP5
    type: std-req
    title: "MAN.3.BP5: Define and monitor project estimates and resources"
    status: approved
    description: |
      Define and monitor project estimates of effort and resources based on project's goals, project risks, motivation and boundaries.
      
      .. note::
      
      Examples of necessary resources are budget, people, product samples, or infrastructure
      
      .. note::
      
      Project risks (using MAN.5) may be considered.
      
      .. note::
      
      Estimations and resources may include engineering, management and supporting processes.
    fields:
      links: "std_req__aspice_40__iic-08-54,std_req__aspice_40__iic-08-56,std_req__aspice_40__iic-13-16,std_req__aspice_40__iic-13-51,std_req__aspice_40__iic-13-52,std_req__aspice_40__iic-14-02,std_req__aspice_40__iic-14-10,std_req__aspice_40__iic-18-52"
  - id: STD_REQ__ASPICE_40__MAN-3-BP6
    type: std-req
    title: "MAN.3.BP6: Define and monitor required skills, knowledge, and experience"
    status: approved
    description: |
      Identify and monitor the required skills, knowledge, and experience for the project in line with the estimates and work packages.
      
      .. note::
      
      Training, mentoring or coaching of individuals may be applied to resolve deviations from required skills and knowledge.
    fields:
      links: "std_req__aspice_40__iic-08-56,std_req__aspice_40__iic-13-16,std_req__aspice_40__iic-13-51,std_req__aspice_40__iic-13-52,std_req__aspice_40__iic-14-02,std_req__aspice_40__iic-14-10,std_req__aspice_40__iic-18-52"
  - id: STD_REQ__ASPICE_40__MAN-3-BP7
    type: std-req
    title: "MAN.3.BP7: Define and monitor project interfaces and agreed commitments"
    status: approved
    description: |
      Identify and agree interfaces of the project with affected stakeholders and monitor agreed commitments. Define an escalation mechanism for commitments that are not fulfilled.
      
      .. note::
      
      Affected stakeholders may include other projects, organizational units, sub-contractors, and service providers.
    fields:
      links: "std_req__aspice_40__iic-08-56,std_req__aspice_40__iic-13-16,std_req__aspice_40__iic-13-51,std_req__aspice_40__iic-13-52,std_req__aspice_40__iic-14-02,std_req__aspice_40__iic-14-10,std_req__aspice_40__iic-18-52"
  - id: STD_REQ__ASPICE_40__MAN-3-BP8
    type: std-req
    title: "MAN.3.BP8: Define and monitor project schedule"
    status: approved
    description: |
      Allocate resources to work packages and schedule each activity of the project. Monitor the performance of activities against schedule.
    fields:
      links: "std_req__aspice_40__iic-13-16,std_req__aspice_40__iic-13-51,std_req__aspice_40__iic-14-02,std_req__aspice_40__iic-14-10,std_req__aspice_40__iic-15-06,std_req__aspice_40__iic-18-52"
  - id: STD_REQ__ASPICE_40__MAN-3-BP9
    type: std-req
    title: "MAN.3.BP9: Ensure consistency"
    status: approved
    description: |
      Regularly adjust estimates, resources, skills, work packages and their dependencies, schedules, plans, interfaces, and
      commitments for the project to ensure consistency with the scope of work.
      
      .. note::
      
      This may include the consideration of critical dependencies, that are an input for risk management.
    fields:
      links: "std_req__aspice_40__iic-08-54,std_req__aspice_40__iic-08-56,std_req__aspice_40__iic-13-16,std_req__aspice_40__iic-13-51,std_req__aspice_40__iic-13-52,std_req__aspice_40__iic-14-02,std_req__aspice_40__iic-14-10,std_req__aspice_40__iic-14-50,std_req__aspice_40__iic-15-06,std_req__aspice_40__iic-18-52"
  - id: STD_REQ__ASPICE_40__MAN-3-BP10
    type: std-req
    title: "MAN.3.BP10: Review and report progress of the project"
    status: approved
    description: |
      Regularly review and report the status of the project and the fulfillment of work packages against
      estimated effort and duration to all affected parties. Prevent recurrence of identified problems.
      
      .. note::
      
      Project reviews may be executed at regular intervals by the management. Project reviews may contribute to identify best practices and lessons learned.
      
      .. note::
      
      Refer to SUP.9 for resolution of problems
    fields:
      links: "std_req__aspice_40__iic-13-16,std_req__aspice_40__iic-13-51,std_req__aspice_40__iic-14-02,std_req__aspice_40__iic-14-10,std_req__aspice_40__iic-15-06,std_req__aspice_40__iic-18-52"
  - id: STD_REQ__ASPICE_40__MAN-5-BP1
    type: std-req
    title: "MAN.5.BP1: Identify sources of risks"
    status: approved
    description: |
      Identify and regularly update the sources of risks with affected parties.
      
      .. note::
      
      Risks may include technical, economical, and schedule risks.
      
      .. note::
      
      Risks may include the suppliers’ deliverables and services.
      
      .. note::
      
      The risk sources may vary across the entire project life cycle.
    fields:
      links: "std_req__aspice_40__iic-15-09,std_req__aspice_40__iic-15-51"
  - id: STD_REQ__ASPICE_40__MAN-5-BP2
    type: std-req
    title: "MAN.5.BP2: Identify potential undesirable events"
    status: approved
    description: |
      Identify potential undesirable events within the scope of the risk management for the project.
    fields:
      links: std_req__aspice_40__iic-15-51
  - id: STD_REQ__ASPICE_40__MAN-5-BP3
    type: std-req
    title: "MAN.5.BP3: Determine risks"
    status: approved
    description: |
      Determine the probability and severity of the undesirable events to support priorities for the mitigation of the risks.
      
      .. note::
      
      Different methods may be used to analyze technical risks of a system, for example, functional analysis, simulation, FMEA, FTA etc.
    fields:
      links: "std_req__aspice_40__iic-15-09,std_req__aspice_40__iic-15-51"
  - id: STD_REQ__ASPICE_40__MAN-5-BP4
    type: std-req
    title: "MAN.5.BP4: Define risk treatment options"
    status: approved
    description: |
      For each risk select a treatment option to accept, mitigate, avoid, or share (transfer) the risk.
    fields:
      links: "std_req__aspice_40__iic-08-55,std_req__aspice_40__iic-14-02,std_req__aspice_40__iic-15-09,std_req__aspice_40__iic-15-51"
  - id: STD_REQ__ASPICE_40__MAN-5-BP5
    type: std-req
    title: "MAN.5.BP5: Define and perform risk treatment activities"
    status: approved
    description: |
      Define and perform risk activities for risk treatment options.
    fields:
      links: "std_req__aspice_40__iic-08-55,std_req__aspice_40__iic-14-02,std_req__aspice_40__iic-15-09,std_req__aspice_40__iic-15-51"
  - id: STD_REQ__ASPICE_40__MAN-5-BP6
    type: std-req
    title: "MAN.5.BP6: Monitor risks"
    status: approved
    description: |
      Regularly re-evaluate the risk related to the identified potential undesirable events to determine
      changes in the status of a risk and to evaluate the progress of the risk treatment activities.
      
      .. note::
      
      Risks of high priority may need to be communicated to and monitored by higher levels of management.
    fields:
      links: "std_req__aspice_40__iic-08-55,std_req__aspice_40__iic-14-02,std_req__aspice_40__iic-15-09"
  - id: STD_REQ__ASPICE_40__MAN-5-BP7
    type: std-req
    title: "MAN.5.BP7: Take corrective action"
    status: approved
    description: |
      When risk treatment activities are not effective, take appropriate corrective action.
      
      .. note::
      
      Corrective actions may involve reevaluation of risks, developing and implementing new mitigation concepts or adjusting the existing concepts.
    fields:
      links: "std_req__aspice_40__iic-08-55,std_req__aspice_40__iic-14-02,std_req__aspice_40__iic-15-09,std_req__aspice_40__iic-15-51"
  - id: STD_REQ__ASPICE_40__MLE-1-BP1
    type: std-req
    title: "MLE.1.BP1: Specify ML requirements"
    status: approved
    description: |
      Use the software requirements and the software architecture to identify and specify functional and non-functional ML requirements, as well as ML data requirements specifying data characteristics (e.g., gender, weather conditions, street conditions within the ODD) and their expected distributions.
      
      .. note::
      
      Non-functional requirements may include relevant characteristics of the ODD and KPIs as robustness, performance, and level of trustworthiness.
      
      .. note::
      
      The ML data requirements are input for SUP.11 Machine Learning Data Management but also for other MLE processes.
      
      .. note::
      
      In case of ML development only, stakeholder requirements represent the software requirements.
    fields:
      links: std_req__aspice_40__iic-17-00
  - id: STD_REQ__ASPICE_40__MLE-1-BP2
    type: std-req
    title: "MLE.1.BP2: Structure ML requirements"
    status: approved
    description: |
      Structure and prioritize the ML requirements.
      
      .. note::
      
      Examples for structuring criteria can be grouping (e.g., by functionality) or variants identification.
      
      .. note::
      
      Prioritization can be done according to project or stakeholder needs via e.g., definition of release scopes. Refer to SPL.2.BP1.
    fields:
      links: "std_req__aspice_40__iic-17-00, std_req__aspice_40__iic-17-54"
  - id: STD_REQ__ASPICE_40__MLE-1-BP3
    type: std-req
    title: "MLE.1.BP3: Analyze ML requirements"
    status: approved
    description: |
      Analyze the specified ML requirements including their interdependencies to ensure correctness, technical feasibility, and ability for machine learning model testing, and to support project management regarding project estimates.
      
      .. note::
      
      See MAN.3.BP3 for project feasibility and MAN.3.BP5 for project estimates.
    fields:
      links: "std_req__aspice_40__iic-17-54,std_req__aspice_40__iic-15-51"
  - id: STD_REQ__ASPICE_40__MLE-1-BP4
    type: std-req
    title: "MLE.1.BP4: Analyze the impact on the ML operating environment"
    status: approved
    description: |
      Analyze the impact that the ML requirements will have on interfaces of software components and the ML operating environment.
      
      .. note::
      
      The ML operating environment is defined as the infrastructure and information which both the trained ML model and the deployed ML model need for execution.
    fields:
      links: std_req__aspice_40__iic-15-51
  - id: STD_REQ__ASPICE_40__MLE-1-BP5
    type: std-req
    title: "MLE.1.BP5: Ensure consistency and establish bidirectional traceability"
    status: approved
    description: |
      Ensure consistency and establish bidirectional traceability between ML requirements and software requirements and between ML requirements and the software architecture.
      
      .. note::
      
      Bidirectional traceability supports consistency, facilitates impact analyses of change requests, and verification coverage demonstration. Traceability alone, e.g., the existence of links, does not necessarily mean that the information is consistent with each other.
      
      .. note::
      
      Redundant traceability is not intended, but at least one out of the given traceability paths.
    fields:
      links: std_req__aspice_40__iic-13-51
  - id: STD_REQ__ASPICE_40__MLE-1-BP6
    type: std-req
    title: "MLE.1.BP6: Communicate agreed ML requirements and impact on the operating environment"
    status: approved
    description: |
      Communicate the agreed ML requirements, and the results of the impact analysis on the ML operating environment to all affected parties.
    fields:
      links: std_req__aspice_40__iic-13-52
  - id: STD_REQ__ASPICE_40__MLE-2-BP1
    type: std-req
    title: "MLE.2.BP1: Develop ML architecture"
    status: approved
    description: |
      Develop and document the ML architecture that specifies ML architectural elements including details of the ML model, pre- and postprocessing, and hyperparameters which are required to create, train, test, and deploy the ML model.
      
      .. note::
      
      Necessary details of the ML model may include layers, activation functions, and backpropagation. The level of detail of the ML model may not need to cover aspects like single neurons.
      
      .. note::
      
      The details of the ML model may differ between the ML model used during training and the deployed ML model.
    fields:
      links: "std_req__aspice_40__iic-04-51, std_req__aspice_40__iic-01-54, std_req__aspice_40__iic-15-51"
  - id: STD_REQ__ASPICE_40__MLE-2-BP2
    type: std-req
    title: "MLE.2.BP2: Determine hyperparameter ranges and initial values"
    status: approved
    description: |
      Determine and document the hyperparameter ranges and the initial values as a basis for the training.
    fields:
      links: "std_req__aspice_40__iic-04-51,std_req__aspice_40__iic-01-54"
  - id: STD_REQ__ASPICE_40__MLE-2-BP3
    type: std-req
    title: "MLE.2.BP3: Analyze ML architectural elements"
    status: approved
    description: |
      Define criteria for analysis of the ML architectural elements. Analyze ML architectural elements according to the defined criteria.
      
      .. note::
      
      Trustworthiness and explainability might be criteria for the analysis of the ML architectural elements.
    fields:
      links: "std_req__aspice_40__iic-04-51,std_req__aspice_40__iic-15-51"
  - id: STD_REQ__ASPICE_40__MLE-2-BP4
    type: std-req
    title: "MLE.2.BP4: Define interfaces of the ML architectural elements"
    status: approved
    description: |
      Determine and document the internal and external interfaces of each ML architectural element including its interfaces to related software components.
    fields:
      links: std_req__aspice_40__iic-04-51
  - id: STD_REQ__ASPICE_40__MLE-2-BP5
    type: std-req
    title: "MLE.2.BP5: Define resource consumption objectives for the ML architectural elements"
    status: approved
    description: |
      Determine and document the resource consumption objectives for all relevant ML architectural elements during training and deployment.
    fields:
      links: std_req__aspice_40__iic-04-51
  - id: STD_REQ__ASPICE_40__MLE-2-BP6
    type: std-req
    title: "MLE.2.BP6: Ensure consistency and establish bidirectional traceability"
    status: approved
    description: |
      Ensure consistency and establish bidirectional traceability between the ML architectural elements and the ML requirements.
      
      .. note::
      
      Bidirectional traceability supports consistency, and facilitates impact analyses of change requests, and verification coverage demonstration. Traceability alone, e.g., the existence of links, does not necessarily mean that the information is consistent with each other.
      
      .. note::
      
      The bidirectional traceability should be established on a reasonable level of abstraction to the ML architectural elements.
    fields:
      links: std_req__aspice_40__iic-13-51
  - id: STD_REQ__ASPICE_40__MLE-2-BP7
    type: std-req
    title: "MLE.2.BP7: Communicate agreed ML architecture"
    status: approved
    description: |
      Inform all affected parties about the agreed ML architecture including the details of the ML model and the initial hyperparameter values.
    fields:
      links: std_req__aspice_40__iic-13-52
  - id: STD_REQ__ASPICE_40__MLE-3-BP1
    type: std-req
    title: "MLE.3.BP1: Specify ML training and validation approach"
    status: approved
    description: |
      Specify an approach which supports the training and validation of the ML model to meet the defined ML requirements. The ML training and validation approach includes
      
      * entry and exit criteria of the training and validation,
      * approaches for hyperparameter tuning / optimization,
      * approach for data set creation and modification, and
      * training and validation environment
      
      .. note::
      
      The ML training and validation approach may include random dropout and other robustification methods.
      
      .. note::
      
      ML validation is the optimization of the hyperparameters during Machine Learning Training (MLE.3). The term "validation" has a different meaning than VAL.1.
      
      .. note::
      
      The training environment should reflect the environment of the deployed model.
    fields:
      links: std_req__aspice_40__iic-08-65
  - id: STD_REQ__ASPICE_40__MLE-3-BP2
    type: std-req
    title: "MLE.3.BP2: Create ML training and validation data set"
    status: approved
    description: |
      Select data from the ML data collection provided by SUP.11 and assign them to the data set for training and validation of the ML model according to the specified ML training and validation approach.
      
      .. note::
      
      The ML training and validation data set may include corner cases, unexpected cases, and normal cases depending on the ML requirements.
      
      .. note::
      
      A separated data set for training and validation might not be required in some cases (e.g., k-fold cross validation, no optimization of hyperparameters).
    fields:
      links: std_req__aspice_40__iic-03-51
  - id: STD_REQ__ASPICE_40__MLE-3-BP3
    type: std-req
    title: "MLE.3.BP3: Create and optimize ML model"
    status: approved
    description: |
      Create the ML model according to the ML architecture and train it, using the identified ML training and validation data set according to the ML training and validation approach to meet the defined ML requirements, and training and validation exit criteria.
    fields:
      links: "std_req__aspice_40__iic-01-53,std_req__aspice_40__iic-01-54"
  - id: STD_REQ__ASPICE_40__MLE-3-BP4
    type: std-req
    title: "MLE.3.BP4: Ensure consistency and establish bidirectional traceability"
    status: approved
    description: |
      Ensure consistency and establish bidirectional traceability between the ML training and validation data set and the ML data requirements.
      
      .. note::
      
      Bidirectional traceability supports consistency and facilitates impact analyses of change requests. Traceability alone, e.g., the existence of links, does not necessarily mean that the information is consistent with each other.
    fields:
      links: std_req__aspice_40__iic-13-51
  - id: STD_REQ__ASPICE_40__MLE-3-BP5
    type: std-req
    title: "MLE.3.BP5: Summarize and communicate agreed trained ML model"
    status: approved
    description: |
      Summarize the results of the optimization and inform all affected parties about the agreed trained ML model.
    fields:
      links: std_req__aspice_40__iic-13-52
  - id: STD_REQ__ASPICE_40__MLE-4-BP1
    type: std-req
    title: "MLE.4.BP1: Specify an ML test approach"
    status: approved
    description: |
      Specify an ML test approach suitable to provide evidence for compliance of the trained ML model and the deployed ML model with the ML requirements. The ML test approach includes
      
      * ML test scenarios with distribution of data characteristics (e.g., gender, weather conditions, street conditions within the ODD) defined by ML requirements,
      * distribution and frequency of each ML test scenario inside the ML test data set,
      * expected test result per test datum,
      * entry and exit criteria of the testing,
      * approach for data set creation and modification, and
      * the required testing infrastructure and environment setup.
      
      .. note::
      
      Expected test result per test datum might require labeling of test data to support comparison of output of the ML model with the expected output.
      
      .. note::
      
      Test datum is the smallest amount of data which is processed by the ML model into only one output. E.g., one image in photo processing or an audio sequence in voice recognition.
      
      .. note::
      
      Data characteristic is one property of the data that may have different expressions in the ODD. E.g., weather condition may contain expressions like sunny, foggy or rainy.
      
      .. note::
      
      An ML test scenario is a combination of expressions of all defined data characteristics e.g., weather conditions = sunny, street conditions = gravel road.
    fields:
      links: std_req__aspice_40__iic-08-64
  - id: STD_REQ__ASPICE_40__MLE-4-BP2
    type: std-req
    title: "MLE.4.BP2: Create ML test data set"
    status: approved
    description: |
      Create the ML test data set needed for testing of the trained ML model and testing of the deployed ML model from the ML data collection provided by SUP.11 considering the ML test approach. The ML test data set shall not be used for training.
      
      .. note::
      
      The ML test data set for the trained ML model might differ from the test data set of the deployed ML model.
      
      .. note::
      
      Additional data sets might be used for special purposes like assurance of safety, fairness, robustness.
    fields:
      links: std_req__aspice_40__iic-03-51
  - id: STD_REQ__ASPICE_40__MLE-4-BP3
    type: std-req
    title: "MLE.4.BP3: Test trained ML model"
    status: approved
    description: |
      Test the trained ML model according to the ML test approach using the created ML test data set. Record and evaluate the ML test results.
      
      .. note::
      
      Evaluation of test logs might include pattern analysis of failed test data to support e.g., trustworthiness.
    fields:
      links: std_req__aspice_40__iic-13-50
  - id: STD_REQ__ASPICE_40__MLE-4-BP4
    type: std-req
    title: "MLE.4.BP4: Derive deployed ML model"
    status: approved
    description: |
      Derive the deployed ML model from the trained ML model according to the ML architecture. The deployed ML model shall be used for testing and delivery to software integration.
      
      .. note::
      
      The deployed ML model will be integrated into the target system and may differ from the trained ML model which often requires powerful hardware and uses interpretative languages.
    fields:
      links: "std_req__aspice_40__iic-11-50, std_req__aspice_40__iic-13-50"
  - id: STD_REQ__ASPICE_40__MLE-4-BP5
    type: std-req
    title: "MLE.4.BP5: Test deployed ML model"
    status: approved
    description: |
      Test the deployed ML model according to the ML test approach using the created ML test data set. Record and evaluate the ML test results.
    fields:
      links: "std_req__aspice_40__iic-11-50, std_req__aspice_40__iic-13-50"
  - id: STD_REQ__ASPICE_40__MLE-4-BP6
    type: std-req
    title: "MLE.4.BP6: Ensure consistency and establish bidirectional traceability"
    status: approved
    description: |
      Ensure consistency and establish bidirectional traceability between the ML test approach and the ML requirements, and the ML test data set and the ML data requirements; and bidirectional traceability is established between the ML test approach and ML test results.
      
      .. note::
      
      Bidirectional traceability supports consistency, and facilitates impact analyses of change requests, and verification coverage demonstration. Traceability alone, e.g., the existence of links, does not necessarily mean that the information is consistent with each other.
    fields:
      links: std_req__aspice_40__iic-13-51
  - id: STD_REQ__ASPICE_40__MLE-4-BP7
    type: std-req
    title: "MLE.4.BP7: Summarize and communicate results"
    status: approved
    description: |
      Summarize the ML test results of the ML model. Inform all affected parties about the agreed results and the deployed ML model.
    fields:
      links: std_req__aspice_40__iic-13-52
  - id: STD_REQ__ASPICE_40__PIM-3-BP1
    type: std-req
    title: "PIM.3.BP1: Establish commitment"
    status: approved
    description: |
      Establish commitment to support the process improvement staff, to provide resources and further enablers to sustain improvement actions.
      
      .. note::
      
      The process improvement process is a generic process, which can be used at all levels (e.g, organizational level, process level, project level, etc.) and which can be used to improve all processes.
      
      .. note::
      
      Commitment at all levels of management may support process improvement.
      
      .. note::
      
      Enablers for improvement measures may include trainings, methods, infrastructure, etc.
    fields:
      links: std_req__aspice_40__iic-02-01
  - id: STD_REQ__ASPICE_40__PIM-3-BP2
    type: std-req
    title: "PIM.3.BP2: Identify improvement measures"
    status: approved
    fields:
      links: "std_req__aspice_40__iic-13-16,std_req__aspice_40__iic-15-51,std_req__aspice_40__iic-15-13,std_req__aspice_40__iic-15-16"
  - id: STD_REQ__ASPICE_40__PIM-3-BP3
    type: std-req
    title: "PIM.3.BP3: Establish process improvement goals"
    status: approved
    description: |
      Analyze the current status of the existing processes and establish improvement goals.
      
      .. note::
      
      The current status of processes may be determined by process assessment.
    fields:
      links: "std_req__aspice_40__iic-06-04,std_req__aspice_40__iic-10-00,std_req__aspice_40__iic-15-51,std_req__aspice_40__iic-15-13,std_req__aspice_40__iic-16-06"
  - id: STD_REQ__ASPICE_40__PIM-3-BP4
    type: std-req
    title: "PIM.3.BP4: Prioritize improvements"
    status: approved
    description: |
      Prioritize the improvement goals and improvement measures.
    fields:
      links: "std_req__aspice_40__iic-06-04,std_req__aspice_40__iic-10-00,std_req__aspice_40__iic-15-51,std_req__aspice_40__iic-15-13,std_req__aspice_40__iic-16-06"
  - id: STD_REQ__ASPICE_40__PIM-3-BP5
    type: std-req
    title: "PIM.3.BP5: Define process improvement measures"
    status: approved
    description: |
      Process improvement measures are defined.
      
      .. note::
      
      Improvements may be documented in incremental steps.
    fields:
      links: "std_req__aspice_40__iic-06-04,std_req__aspice_40__iic-10-00,std_req__aspice_40__iic-15-51,std_req__aspice_40__iic-15-13,std_req__aspice_40__iic-16-06"
  - id: STD_REQ__ASPICE_40__PIM-3-BP6
    type: std-req
    title: "PIM.3.BP6: Implement process improvement measures"
    status: approved
    description: |
      Implement and apply the improvements to the processes. Update the Process documentation and train people as needed.
      
      .. note::
      
      Process application can be supported by establishing policies, adequate process infrastructure,
      process training, process coaching and tailoring processes to local needs.
      
      .. note::
      
      Improvements may be piloted before roll out within the organization.
    fields:
      links: "std_req__aspice_40__iic-06-04,std_req__aspice_40__iic-10-00,std_req__aspice_40__iic-15-51,std_req__aspice_40__iic-15-13,std_req__aspice_40__iic-16-06"
  - id: STD_REQ__ASPICE_40__PIM-3-BP7
    type: std-req
    title: "PIM.3.BP7: Confirm process improvement"
    status: approved
    description: |
      The effects of process implementation are monitored and measured, and the achievement of defined improvement goals is confirmed.
    fields:
      links: "std_req__aspice_40__iic-07-04,std_req__aspice_40__iic-15-51,std_req__aspice_40__iic-15-13"
  - id: STD_REQ__ASPICE_40__PIM-3-BP8
    type: std-req
    title: "PIM.3.BP8: Communicate results of improvement"
    status: approved
    description: |
      Knowledge gained from the improvements and progress of the improvement implementation is communicated to affected parties.
    fields:
      links: "std_req__aspice_40__iic-06-04,std_req__aspice_40__iic-07-04,std_req__aspice_40__iic-13-52"
  - id: STD_REQ__ASPICE_40__REU-2-BP1
    type: std-req
    title: "REU.2.BP1: Select products for reuse"
    status: approved
    description: |
      Select the products to be reused using defined criteria.
      
      .. note::
      
      Products for reuse may be systems, hardware or software components, third party components or legacy components.
    fields:
      links: std_req__aspice_40__iic-12-03
  - id: STD_REQ__ASPICE_40__REU-2-BP2
    type: std-req
    title: "REU.2.BP2: Analyze the reuse capability of the product"
    status: approved
    description: |
      Analyze the designated target architecture and the product to be reused to determine its
      applicability in the target architecture according to relevant criteria.
      
      .. note::
      
      Examples for criteria can be requirements compliance, verifiability of the product to be reused in the target architecture, or portability/interoperability.
    fields:
      links: "std_req__aspice_40__iic-04-02,std_req__aspice_40__iic-15-07"
  - id: STD_REQ__ASPICE_40__REU-2-BP3
    type: std-req
    title: "REU.2.BP3: Define limitations for reuse"
    status: approved
    description: |
      Define and communicate limitations for the products to be reused.
      
      .. note::
      
      Limitations may address parameters of operational environment.
    fields:
      links: "std_req__aspice_40__iic-04-02,std_req__aspice_40__iic-15-07"
  - id: STD_REQ__ASPICE_40__REU-2-BP4
    type: std-req
    title: "REU.2.BP4: Ensure qualification of products for reuse"
    status: approved
    description: |
      Provide evidence that the product for reuse is qualified for the intended use of the deliverable.
      
      .. note::
      
      Qualification may be demonstrated by verification evidence.
      
      .. note::
      
      Verification may include the appropriateness of documentation.
    fields:
      links: std_req__aspice_40__iic-13-53
  - id: STD_REQ__ASPICE_40__REU-2-BP5
    type: std-req
    title: "REU.2.BP5: Provide products for reuse"
    status: approved
    description: |
      Make available the product to be reused to affected parties.
      
      .. note::
      
      Refer to HWE.3, SWE.5 or SYS.4 for more information on integration of hardware, software, or system components.
    fields:
      links: std_req__aspice_40__iic-12-03
  - id: STD_REQ__ASPICE_40__REU-2-BP6
    type: std-req
    title: "REU.2.BP6: Communicate information about effectiveness of reuse activities"
    status: approved
    description: |
      Establish communication and notification mechanism about experiences and technical outcomes to the provider of reused products.
      
      .. note::
      
      The communication with the provider of a reused product may depend on whether the product is under development or not.
    fields:
      links: std_req__aspice_40__iic-13-52
  - id: STD_REQ__ASPICE_40__SPL-2-BP1
    type: std-req
    title: "SPL.2.BP1: Define the functional content of releases"
    status: approved
    description: |
      Define the functionality to be included and the release criteria for each release.
      
      .. note::
      
      This may include the hardware elements, software elements, and extra application parameter files
      (influencing the identified system functionality) that are needed for the release.
    fields:
      links: "std_req__aspice_40__iic-11-03,std_req__aspice_40__iic-18-06"
  - id: STD_REQ__ASPICE_40__SPL-2-BP2
    type: std-req
    title: "SPL.2.BP2: Define release package"
    status: approved
    description: |
      Define the release as well as supporting tools and information.
      
      .. note::
      
      The release package may include also programming tools.
    fields:
      links: "std_req__aspice_40__iic-11-03,std_req__aspice_40__iic-18-06"
  - id: STD_REQ__ASPICE_40__SPL-2-BP3
    type: std-req
    title: "SPL.2.BP3: Ensure unique identification of releases"
    status: approved
    description: |
      Ensure a unique identification of the release based upon the intended purpose and expectations of the release.
      
      .. note::
      
      Unique identification may be realized by a classification and numbering scheme for product releases.
    fields:
      links: "std_req__aspice_40__iic-11-03,std_req__aspice_40__iic-11-04,std_req__aspice_40__iic-13-06"
  - id: STD_REQ__ASPICE_40__SPL-2-BP4
    type: std-req
    title: "SPL.2.BP4: Build the release from items under configuration control"
    status: approved
    description: |
      Build the release from items under configuration control to ensure integrity.
      
      .. note::
      
      This practice may be supported by the SUP.8 Configuration Management Process.
    fields:
      links: "std_req__aspice_40__iic-11-04,std_req__aspice_40__iic-18-06"
  - id: STD_REQ__ASPICE_40__SPL-2-BP5
    type: std-req
    title: "SPL.2.BP5: Ensure release approval before delivery"
    status: approved
    description: |
      Criteria for the release are satisfied before delivery takes place.
    fields:
      links: "std_req__aspice_40__iic-11-03,std_req__aspice_40__iic-13-13,std_req__aspice_40__iic-18-06"
  - id: STD_REQ__ASPICE_40__SPL-2-BP6
    type: std-req
    title: "SPL.2.BP6: Provide a release note"
    status: approved
    description: |
      A release is accompanied by information detailing key characteristics of the release.
      
      .. note::
      
      The release note may include information about legal aspects like relevant target markets,
      legislation that is considered etc. See also VAL.1 Validation.
    fields:
      links: "std_req__aspice_40__iic-11-03,std_req__aspice_40__iic-11-04,std_req__aspice_40__iic-13-06,std_req__aspice_40__iic-13-13"
  - id: STD_REQ__ASPICE_40__SPL-2-BP7
    type: std-req
    title: "SPL.2.BP7: Communicate the type, service level and duration of support for a release"
    status: approved
    description: |
      Identify and communicate the type, service level and duration of support for a release.
    fields:
      links: "std_req__aspice_40__iic-11-03,std_req__aspice_40__iic-11-04,std_req__aspice_40__iic-13-06,std_req__aspice_40__iic-13-13"
  - id: STD_REQ__ASPICE_40__SPL-2-BP8
    type: std-req
    title: "SPL.2.BP8: Deliver the release package to the intended customer"
    status: approved
    description: |
      Deliver the release package to the intended customer.
      
      .. note::
      
      The intended customer may be an internal organizational unit or an external organization.
    fields:
      links: "std_req__aspice_40__iic-11-03,std_req__aspice_40__iic-13-06,std_req__aspice_40__iic-13-13"
  - id: STD_REQ__ASPICE_40__SUP-1-BP1
    type: std-req
    title: "SUP.1.BP1: Ensure independence of quality assurance"
    status: approved
    description: |
      Ensure that quality assurance is performed independently and objectively without conflicts of interest.
      
      .. note::
      
      Possible inputs for evaluating the independence may be assignment to financial and/or organizational
      structure as well as responsibility for processes that are subject to quality assurance (no self-monitoring).
    fields:
      links: std_req__aspice_40__iic-16-50
  - id: STD_REQ__ASPICE_40__SUP-1-BP2
    type: std-req
    title: "SUP.1.BP2: Define criteria for quality assurance"
    status: approved
    description: |
      Define quality criteria for work products as well as for process tasks and their performance.
      
      .. note::
      
      Quality criteria may consider internal and external inputs such as customer requirements, standards, milestones, etc.
    fields:
      links: std_req__aspice_40__iic-18-07
  - id: STD_REQ__ASPICE_40__SUP-1-BP3
    type: std-req
    title: "SUP.1.BP3: Assure quality of work products"
    status: approved
    description: |
      Identify work products subject to quality assurance according to the quality criteria.
      Perform appropriate activities to evaluate the work products against the defined quality criteria and document the results.
      
      .. note::
      
      Quality assurance activities may include reviews, problem analysis and
      lessons learned that improve the work products for further use.
    fields:
      links: "std_req__aspice_40__iic-18-07,std_req__aspice_40__iic-13-52,std_req__aspice_40__iic-13-18,std_req__aspice_40__iic-13-19,std_req__aspice_40__iic-14-02"
  - id: STD_REQ__ASPICE_40__SUP-1-BP4
    type: std-req
    title: "SUP.1.BP4: Assure quality of process activities"
    status: approved
    description: |
      Identify processes subject to quality assurance according to the quality criteria.
      Perform appropriate activities to evaluate the processes against their defined quality criteria and
      associated target values and document the results.
      
      .. note::
      
      Quality assurance activities may include process assessments, problem analysis, regular check of methods, tools, and
      the adherence to defined processes, and consideration of lessons learned.
    fields:
      links: "std_req__aspice_40__iic-18-07,std_req__aspice_40__iic-13-52,std_req__aspice_40__iic-13-18,std_req__aspice_40__iic-13-19,std_req__aspice_40__iic-14-02"
  - id: STD_REQ__ASPICE_40__SUP-1-BP5
    type: std-req
    title: "SUP.1.BP5: Summarize and communicate quality assurance activities and results"
    status: approved
    description: |
      Regularly report performance, non-conformances, and trends of quality assurance activities to all affected parties.
    fields:
      links: "std_req__aspice_40__iic-16-50,std_req__aspice_40__iic-18-52,std_req__aspice_40__iic-18-07,std_req__aspice_40__iic-13-52,std_req__aspice_40__iic-13-18,std_req__aspice_40__iic-13-19,std_req__aspice_40__iic-14-02"
  - id: STD_REQ__ASPICE_40__SUP-1-BP6
    type: std-req
    title: "SUP.1.BP6: Ensure resolution of non-conformances"
    status: approved
    description: |
      Analyze, track, correct, resolve, and further prevent non-conformances found in quality assurance activities.
      
      .. note::
      
      Non-conformances detected in work products may be entered into the problem resolution management process (SUP.9).
      
      .. note::
      
      Non-conformances detected in the process definition or implementation may be entered into a process improvement process (PIM.3).
    fields:
      links: "std_req__aspice_40__iic-18-52,std_req__aspice_40__iic-18-07,std_req__aspice_40__iic-13-52,std_req__aspice_40__iic-13-18,std_req__aspice_40__iic-13-19,std_req__aspice_40__iic-14-02"
  - id: STD_REQ__ASPICE_40__SUP-1-BP7
    type: std-req
    title: "SUP.1.BP7: Escalate non-conformances"
    status: approved
    description: |
      Escalate relevant non-conformances to appropriate levels of management and other relevant stakeholders to facilitate their resolution.
      
      .. note::
      
      The decision whether to escalate non-conformances may be based on criteria such as delay of resolution, urgency, and risk.
    fields:
      links: "std_req__aspice_40__iic-16-50,std_req__aspice_40__iic-18-52,std_req__aspice_40__iic-13-52,std_req__aspice_40__iic-14-02"
  - id: STD_REQ__ASPICE_40__SUP-10-BP1
    type: std-req
    title: "SUP.10.BP1: Identify and record the change requests"
    status: approved
    description: |
      The scope for application of change requests is identified.
      Each change request is uniquely identified, described, and recorded, including the initiator and reason of the change request.
      A status is assigned to each change request to facilitate tracking.
      
      .. note::
      
      Change requests may be used for changes related to e.g., product, process, methods.
      
      .. note::
      
      Example values for the change request status are “open”, “under investigation”, “implemented”, etc.
      
      .. note::
      
      The change request handling may differ across the product life cycle e.g., during prototype
    fields:
      links: std_req__aspice_40__iic-13-16
  - id: STD_REQ__ASPICE_40__SUP-10-BP2
    type: std-req
    title: "SUP.10.BP2: Analyze and assess change requests"
    status: approved
    description: |
      Change requests are analyzed by relevant parties according to analysis criteria.
      Work products affected by the change request and dependencies to other change requests are determined.
      The impact of the change requests is assessed.
      
      .. note::
      
      Examples for analysis criteria are: resource requirements, scheduling issues, risks, benefits, etc.
    fields:
      links: "std_req__aspice_40__iic-18-57,std_req__aspice_40__iic-13-16"
  - id: STD_REQ__ASPICE_40__SUP-10-BP3
    type: std-req
    title: "SUP.10.BP3: Approve change requests before implementation"
    status: approved
    description: |
      Change requests are prioritized and approved for implementation based on analysis results and availability of resources.
      
      .. note::
      
      A Change Control Board (CCB) is an example mechanism used to approve change requests.
      
      .. note::
      
      Prioritization of change requests may be done by allocation to releases.
    fields:
      links: std_req__aspice_40__iic-13-16
  - id: STD_REQ__ASPICE_40__SUP-10-BP4
    type: std-req
    title: "SUP.10.BP4: Establish bidirectional traceability"
    status: approved
    description: |
      Establish bidirectional traceability between change requests and work products affected by the change requests.
      In case that the change request is initiated by a problem, establish bidirectional traceability between change requests
      and the corresponding problem reports.
    fields:
      links: std_req__aspice_40__iic-13-51
  - id: STD_REQ__ASPICE_40__SUP-10-BP5
    type: std-req
    title: "SUP.10.BP5: Confirm the implementation of change requests"
    status: approved
    description: |
      The implementation of change requests is confirmed before closure by relevant stakeholders.
    fields:
      links: std_req__aspice_40__iic-13-16
  - id: STD_REQ__ASPICE_40__SUP-10-BP6
    type: std-req
    title: "SUP.10.BP6: Track change requests to closure"
    status: approved
    description: |
      Change requests are tracked to closure. The status of change requests is communicated to all affected parties.
      
      .. note::
      
      Examples for informing affected parties can be daily standup meetings or tool-supported workflows.
    fields:
      links: std_req__aspice_40__iic-13-16
  - id: STD_REQ__ASPICE_40__SUP-11-BP1
    type: std-req
    title: "SUP.11.BP1: Establish an ML data management system"
    status: approved
    description: |
      Establish an ML data management system which supports
      
      * ML data management activities,
      * relevant sources of ML data,
      * ML data life cycle including a status model, and
      * interfaces to affected parties.
      
      .. note::
      
      Supported ML data management activities may include data collection, labeling/annotation, and structuring.
    fields:
      links: std_req__aspice_40__iic-16-52
  - id: STD_REQ__ASPICE_40__SUP-11-BP2
    type: std-req
    title: "SUP.11.BP2: Develop an ML data quality approach"
    status: approved
    description: |
      Develop an approach to ensure that the quality of ML data is analyzed based on defined ML data quality criteria and activities are performed to support avoidance of biases of data.
      
      .. note::
      
      Examples of ML data quality criteria are relevant data sources, reliability and consistency of labelling, completeness against ML data requirements.
      
      .. note::
      
      The ML data management system should support the quality criteria and activities of the ML data quality approach.
      
      .. note::
      
      Biases to avoid may include sampling bias (e.g., gender, age) and feedback loop bias.
      
      .. note::
      
      For creation of ML data sets see MLE.3.BP2 and MLE.4.BP2.
    fields:
      links: std_req__aspice_40__iic-19-50
  - id: STD_REQ__ASPICE_40__SUP-11-BP3
    type: std-req
    title: "SUP.11.BP3: Collect ML data"
    status: approved
    description: |
      Relevant sources for raw data are identified and continuously monitored for changes. The raw data is collected according to the ML data requirements.
      
      .. note::
      
      The identification and collection of ML data might be an organizational responsibility.
      
      .. note::
      
      Continuous monitoring should include the ODD and may lead to changes of the ML requirements.
    fields:
      links: std_req__aspice_40__iic-03-53
  - id: STD_REQ__ASPICE_40__SUP-11-BP4
    type: std-req
    title: "SUP.11.BP4: Process ML data"
    status: approved
    description: |
      The raw data are processed (annotated, analyzed, and structured) according to the ML data requirements.
    fields:
      links: std_req__aspice_40__iic-03-53
  - id: STD_REQ__ASPICE_40__SUP-11-BP5
    type: std-req
    title: "SUP.11.BP5: Assure quality of ML data"
    status: approved
    description: |
      Perform the activities according to the ML data quality approach to ensure that the ML data meets the defined ML data quality criteria.
      
      .. note::
      
      These activities may include sample-based reviews or statistical methods.
    fields:
      links: std_req__aspice_40__iic-03-53
  - id: STD_REQ__ASPICE_40__SUP-11-BP6
    type: std-req
    title: "SUP.11.BP6: Communicate agreed processed ML data"
    status: approved
    description: |
      Inform all affected parties about the agreed processed ML data and provide them to the affected parties.
    fields:
      links: std_req__aspice_40__iic-13-52
  - id: STD_REQ__ASPICE_40__SUP-8-BP1
    type: std-req
    title: "SUP.8.BP1: Identify configuration items"
    status: approved
    description: |
      Define selection criteria for identifying relevant work products to be subject to configuration management.
      Identify and document configuration items according to the defined selection criteria.
      
      .. note::
      
      Configuration items are representing work products or group of work products
      which are subject to configuration management as a single entity.
      
      .. note::
      
      Configuration items may vary in complexity, size, and type, ranging from an entire system including
      all system, hardware, and software documentation down to a single element or document.
      
      .. note::
      
      The selection criteria may be applied to single work products or a group of work products.
    fields:
      links: "std_req__aspice_40__iic-18-53,std_req__aspice_40__iic-01-52"
  - id: STD_REQ__ASPICE_40__SUP-8-BP2
    type: std-req
    title: "SUP.8.BP2: Define configuration item properties"
    status: approved
    description: |
      Define the necessary properties needed for the modification and control of configuration items.
      
      .. note::
      
      The configuration item properties may be defined for single configuration items or a group of items.
      
      .. note::
      
      Configuration item properties may include a status model (e.g., Under Work, Tested, Released, etc.), storage location, access rights, etc.
      
      .. note::
      
      The application of properties may be implemented by attributes of configuration items.
    fields:
      links: std_req__aspice_40__iic-01-52
  - id: STD_REQ__ASPICE_40__SUP-8-BP3
    type: std-req
    title: "SUP.8.BP3: Establish configuration management"
    status: approved
    description: |
      Establish configuration management mechanisms for control of identified configuration items including the configuration item properties,
      including mechanisms for controlling parallel modifications of configuration items.
      
      .. note::
      
      This may include specific mechanisms for different configuration item types, such as branch and merge management, or checkout control.
    fields:
      links: "std_req__aspice_40__iic-16-03,std_req__aspice_40__iic-14-01"
  - id: STD_REQ__ASPICE_40__SUP-8-BP4
    type: std-req
    title: "SUP.8.BP4: Control modifications"
    status: approved
    description: |
      Control modifications using the configuration management mechanisms.
      
      .. note::
      
      This may include the application of a defined status model for configuration items.
    fields:
      links: "std_req__aspice_40__iic-16-03,std_req__aspice_40__iic-14-01"
  - id: STD_REQ__ASPICE_40__SUP-8-BP5
    type: std-req
    title: "SUP.8.BP5: Establish baselines"
    status: approved
    description: |
      Define and establish baselines for internal purposes, and for external product delivery, for all relevant configuration items.
    fields:
      links: "std_req__aspice_40__iic-16-03,std_req__aspice_40__iic-13-08"
  - id: STD_REQ__ASPICE_40__SUP-8-BP6
    type: std-req
    title: "SUP.8.BP6: Summarize and communicate configuration status"
    status: approved
    description: |
      Record, summarize, and communicate the status of configuration items and established baselines
      to affected parties in order to support the monitoring of progress and status.
      
      .. note::
      
      Regular communication of the configuration status, e.g., based on a defined status model supports
      project management, quality activities, and dedicated project phases such as software integration.
    fields:
      links: "std_req__aspice_40__iic-14-01,std_req__aspice_40__iic-15-56"
  - id: STD_REQ__ASPICE_40__SUP-8-BP7
    type: std-req
    title: "SUP.8.BP7: Ensure completeness and consistency"
    status: approved
    description: |
      Ensure that the information about configuration items is correct and complete including configuration item properties.
      Ensure the completeness and consistency of baselines.
      
      .. note::
      
      Completeness and consistency of a baseline means that all required configuration items are included and consistent,
      and have the required status. This can be used to support e.g., project gate approval.
    fields:
      links: "std_req__aspice_40__iic-01-52,std_req__aspice_40__iic-13-08,std_req__aspice_40__iic-13-51"
  - id: STD_REQ__ASPICE_40__SUP-8-BP8
    type: std-req
    title: "SUP.8.BP8: Verify backup and recovery mechanisms availability."
    status: approved
    description: |
      Verify the availability of appropriate backup and recovery mechanisms for the configuration management including
      the controlled configuration items. Initiate measures in case of insufficient backup and recovery mechanisms.
      
      .. note::
      
      Backup and recovery mechanisms may be defined and implemented by organizational units outside the project team.
      This may include references to corresponding procedures or regulations.
    fields:
      links: std_req__aspice_40__iic-06-52
  - id: STD_REQ__ASPICE_40__SUP-9-BP1
    type: std-req
    title: "SUP.9.BP1: Identify and record the problem"
    status: approved
    description: |
      Each problem is uniquely identified, described and recorded.
      A status is assigned to each problem to facilitate tracking.
      Supporting information is provided to reproduce and diagnose the problem.
      
      .. note::
      
      Problems may relate to e.g., product, resources, or methods.
      
      .. note::
      Example values for the problem status are “new”, “solved”, “closed”, etc.
      
      .. note::
      Supporting information may include e.g, the origin of the problem, how it can be reproduced, environmental information, by whom it has been detected.
      
      .. note::
      
      Unique identification supports traceability to changes made as needed by the change request management process (SUP.10).
    fields:
      links: std_req__aspice_40__iic-13-07
  - id: STD_REQ__ASPICE_40__SUP-9-BP2
    type: std-req
    title: "SUP.9.BP2: Determine the cause and the impact of the problem"
    status: approved
    description: |
      Analyze the problem, determine its cause, including common causes if existing, and impact.
      Involve relevant parties. Categorize the problem.
      
      .. note::
      
      Problem categorization (e.g., light, medium, severe) may be based on severity, criticality, urgency, etc.
    fields:
      links: "std_req__aspice_40__iic-13-07,std_req__aspice_40__iic-15-55"
  - id: STD_REQ__ASPICE_40__SUP-9-BP3
    type: std-req
    title: "SUP.9.BP3: Authorize urgent resolution action"
    status: approved
    description: |
      Obtain authorization for immediate action if a problem requires an urgent resolution according to the categorization.
    fields:
      links: std_req__aspice_40__iic-13-07
  - id: STD_REQ__ASPICE_40__SUP-9-BP4
    type: std-req
    title: "SUP.9.BP4: Raise alert notifications"
    status: approved
    description: |
      If according to the categorization the problem has a high impact on other systems or
      other affected parties, an alert notification needs to be raised accordingly.
    fields:
      links: std_req__aspice_40__iic-13-07
  - id: STD_REQ__ASPICE_40__SUP-9-BP5
    type: std-req
    title: "SUP.9.BP5: Initiate problem resolution"
    status: approved
    description: |
      Initiate appropriate actions according to the categorization to resolve the problem long-term,
      including review of those actions or initiate a change request.
      This includes synchronization and consistency with short-term urgent resolution actions, if applicable.
    fields:
      links: std_req__aspice_40__iic-13-07
  - id: STD_REQ__ASPICE_40__SUP-9-BP6
    type: std-req
    title: "SUP.9.BP6: Track problems to closure"
    status: approved
    description: |
      Track the status of problems to closure including all related change requests.
      The closure of problems is accepted by relevant stakeholders.
    fields:
      links: "std_req__aspice_40__iic-13-07,std_req__aspice_40__iic-15-12"
  - id: STD_REQ__ASPICE_40__SUP-9-BP7
    type: std-req
    title: "SUP.9.BP7: Report the status of problem resolution activities"
    status: approved
    description: |
      Collect and analyze problem resolution management data, identify trends, and initiate related actions.
      Regularly report the results of data analysis, the identified trends and the status of problem resolution
      activities to relevant stakeholders.
      
      .. note::
      
      Collected data may contain information about where the problems occurred,
      how and when they were found, what their impacts were, etc.
    fields:
      links: std_req__aspice_40__iic-15-12
  - id: STD_REQ__ASPICE_40__SWE-1-BP1
    type: std-req
    title: "SWE.1.BP1: Specify software requirements"
    status: approved
    description: |
      Use the system requirements and the system
      architecture to identify and document the functional and non-functional requirements for the
      software according to defined characteristics for requirements.
      
      .. note::
      
      Characteristics of requirements are defined in standards such as ISO IEEE 29148, ISO
      26262-8:2018, or the INCOSE Guide for Writing Requirements.
      
      .. note::
      
      Examples for defined characteristics of requirements shared by technical standards are
      verifiability (i.e., verification criteria being inherent in the requirements text),
      unambiguity/comprehensibility, freedom from design and implementation, and not contradicting any
      other requirement.
      
      .. note::
      
      In case of software-only development, the system requirements and the system architecture
      refer to a given operating environment. In that case, stakeholder requirements can be used as the
      basis for identifying the required functions and capabilities of the software.
      
      .. note::
      
      The hardware-software-interface (HSI) definition puts in context hardware and therefore it is
      an interface decision at the system design level. If such a HSI exists, then it may provide input to
      software requirements.
    fields:
      links: std_req__aspice_40__iic-17-00
  - id: STD_REQ__ASPICE_40__SWE-1-BP2
    type: std-req
    title: "SWE.1.BP2: Structure software requirements"
    status: approved
    description: |
      Structure and prioritize the software requirements.
      
      .. note::
      
      Examples for structuring criteria can be grouping (e.g., by functionality) or expressing
      product variants.
      
      .. note::
      
      Prioritization can be done according to project or stakeholder needs via e.g., definition of
      release scopes. Refer to SPL.2.BP1.
    fields:
      links: std_req__aspice_40__iic-17-00;std_req__aspice_40__iic-17-54
  - id: STD_REQ__ASPICE_40__SWE-1-BP3
    type: std-req
    title: "SWE.1.BP3: Analyze software requirements"
    status: approved
    description: |
      Analyze the specified software requirements
      including their interdependencies to ensure correctness, technical feasibility, and to support
      project management regarding project estimates.
      
      .. note::
      
      See MAN.3.BP3 for project feasibility and MAN.3.BP5 for project estimates.
      
      .. note::
      
      Technical feasibility can be evaluated based on e.g., platform or product line, or by
      prototyping.
    fields:
      links: std_req__aspice_40__iic-15-51
  - id: STD_REQ__ASPICE_40__SWE-1-BP4
    type: std-req
    title: "SWE.1.BP4: Analyze the impact on the operating environment"
    status: approved
    description: |
      Analyze the impact that the
      software requirements will have on elements in the operating environment.
    fields:
      links: std_req__aspice_40__iic-15-51
  - id: STD_REQ__ASPICE_40__SWE-1-BP5
    type: std-req
    title: "SWE.1.BP5: Ensure consistency and establish bidirectional traceability"
    status: approved
    description: |
      Ensure
      consistency and establish bidirectional traceability between software requirements and system
      architecture. Ensure consistency and establish bidirectional traceability between software
      requirements and system requirements.
      
      .. note::
      
      Redundant traceability is not intended.
      
      .. note::
      
      There may be non-functional system requirements that the software requirements do not
      trace to. Examples are process requirements or requirements related to later software product
      lifecycle phases such as incident handling. Such requirements are still subject to verification.
      
      .. note::
      
      Bidirectional traceability supports consistency, and facilitates impact analysis of change
      requests, and demonstration of verification coverage. Traceability alone, e.g., the existence of links,
      does not necessarily mean that the information is consistent with each other.
      
      .. note::
      
      In case of software development only, the system requirements and system architecture
      refer to a given operating environment. In that case, consistency and bidirectional traceability can be
      ensured between stakeholder requirements and software requirements.
    fields:
      links: std_req__aspice_40__iic-13-51
  - id: STD_REQ__ASPICE_40__SWE-1-BP6
    type: std-req
    title: "SWE.1.BP6: Communicate agreed software requirements and impact on the operating environment"
    status: approved
    description: |
      Communicate the agreed software requirements, and the results of the analysis
      of impact on the operating environment, to all affected parties.
    fields:
      links: std_req__aspice_40__iic-13-52
  - id: STD_REQ__ASPICE_40__SWE-2-BP1
    type: std-req
    title: "SWE.2.BP1: Specify static aspects of the software architecture"
    status: approved
    description: |
      Specify and document the static aspects of the software architecture
      with respect to the functional and non-functional software requirements,
      including external interfaces and a defined set of software components
      with their interfaces and relationships.
      
      .. note::
      
      The hardware-software-interface (HSI) definition puts in context the hardware design and
      therefore is an aspect of system design (SYS.3).
    fields:
      links: std_req__aspice_40__iic-04-04
  - id: STD_REQ__ASPICE_40__SWE-2-BP2
    type: std-req
    title: "SWE.2.BP2: Specify dynamic aspects of the software architecture"
    status: approved
    description: |
      Specify and document
      the dynamic aspects of the software architecture with respect to the functional and non-
      functional software requirements, including the behavior of the software components and their
      interaction in different software modes, and concurrency aspects.
      
      .. note::
      
      Examples for concurrency aspects are application-relevant interrupt handling, preemptive
      processing, multi-threading.
      
      .. note::
      
      Examples for behavioral descriptions are natural language or semi-formal notation (e.g,
      SysML, UML).
    fields:
      links: std_req__aspice_40__iic-04-04
  - id: STD_REQ__ASPICE_40__SWE-2-BP3
    type: std-req
    title: "SWE.2.BP3: Analyze software architecture"
    status: approved
    description: |
      Analyze the software architecture regarding
      relevant technical design aspects and to support project management regarding project
      estimates. Document a rationale for the software architectural design decision.
      
      .. note::
      
      See MAN.3.BP3 for project feasibility and MAN.3.BP5 for project estimates.
      
      .. note::
      
      The analysis may include the suitability of pre-existing software components for the current
      application.
      
      .. note::
      
      Examples of methods suitable for analyzing technical aspects are prototypes, simulations,
      qualitative analyses.
      
      .. note::
      
      Examples of technical aspects are functionality, timings, and resource consumption (e.g,
      ROM, RAM, external / internal EEPROM or Data Flash or CPU load).
      
      .. note::
      
      Design rationales can include arguments such as proven-in-use, reuse of a software
      framework or software product line, a make-or-buy decision, or found in an evolutionary way (e.g,
      set-based design).
    fields:
      links: std_req__aspice_40__iic-15-51
  - id: STD_REQ__ASPICE_40__SWE-2-BP4
    type: std-req
    title: "SWE.2.BP4: Ensure consistency and establish bidirectional traceability"
    status: approved
    description: |
      Ensure consistency and establish bidirectional traceability between the software architecture and the
      software requirements.
      
      .. note::
      
      There may be non-functional software requirements that the software architectural design
      does not trace to. Examples are development process requirements. Such requirements are still
      subject to verification.
      
      .. note::
      
      Bidirectional traceability supports consistency, and facilitates impact analysis of change
      requests, and demonstration of verification coverage. Traceability alone, e.g, the existence of links,
      does not necessarily mean that the information is consistent with each other.
    fields:
      links: std_req__aspice_40__iic-13-51
  - id: STD_REQ__ASPICE_40__SWE-2-BP5
    type: std-req
    title: "SWE.2.BP5: Communicate agreed software architecture"
    status: approved
    description: |
      Communicate the agreed software
      architecture to all affected parties.
    fields:
      links: std_req__aspice_40__iic-13-52
  - id: STD_REQ__ASPICE_40__SWE-3-BP1
    type: std-req
    title: "SWE.3.BP1: Specify the static aspects of the detailed design"
    status: approved
    description: |
      For each software component
      specify the behavior of its software units, their static structure and relationships, their interfaces
      including
      
      - valid data value ranges for inputs and outputs (from the application domain perspective),
      and
      - physical or measurement units applicable to inputs and outputs (from the application
      domain perspective).
      
      .. note::
      
      The boundary of a software unit is independent from the software unit’s representation in the
      source code, code file structure, or model-based implementation, respectively. It is rather driven by
      the semantics of the application domain perspective. Therefore, a software unit may be, at the code
      level, represented by a single subroutine or a set of subroutines.
      
      .. note::
      
      Examples of valid data value ranges with applicable physical units from the application
      domain perspective are ‘0..200 [m/s]’, ‘0..3.8 [A]’ or ‘1..100 [N]’. For mapping such application
      domain value ranges to programming language-level data types (such as unsigned Integer with a
      value range of 0..65535) refer to {need}`std_bp_aspice-40__SWE-3-BP2`.
      
      .. note::
      
      Examples of a measurement unit are ‘%’ or ‘‰’
      
      .. note::
      
      A counter is an example of a parameter, or a return value, to which neither a physical nor a
      surement unit is applicable.
      
      .. note::
      
      The hardware-software-interface (HSI) definition puts in context the hardware design and
      refore is an aspect of system design (SYS.3).
    fields:
      links: std_req__aspice_40__iic-04-05;std_req__aspice_40__iic-11-05
  - id: STD_REQ__ASPICE_40__SWE-3-BP2
    type: std-req
    title: "SWE.3.BP2: Specify dynamic aspects of the detailed design"
    status: approved
    description: |
      Specify and document the
      dynamic aspects of the detailed design with respect to the software architecture, including the
      interactions between relevant software units to fulfill the component’s dynamic behavior.
      
      .. note::
      
      Examples for behavioral descriptions are natural language or semi-formal notation (e.g,
      SysML, UML).
    fields:
      links: std_req__aspice_40__iic-04-05;std_req__aspice_40__iic-11-05
  - id: STD_REQ__ASPICE_40__SWE-3-BP3
    type: std-req
    title: "SWE.3.BP3: Develop software units"
    status: approved
    description: |
      Develop and document the software units consistent
      with the detailed design, and according to coding principles.
      
      .. note::
      
      Examples for coding principles at capability level 1 are not to use implicit type conversions,
      only one entry and one exit point in subroutines, and range checks (design-by-contract, defensive
      programming). Further examples see e.g, :need:`std_req__iso26262__software_845` together with table 6.
    fields:
      links: std_req__aspice_40__iic-11-05
  - id: STD_REQ__ASPICE_40__SWE-3-BP4
    type: std-req
    title: "SWE.3.BP4: Ensure consistency and establish bidirectional traceability"
    status: approved
    description: |
      Ensure
      consistency and establish bidirectional traceability between the software detailed design and the
      software architecture. Ensure consistency and establish bidirectional traceability between the
      developed software units and the software detailed design. Ensure consistency and establish
      traceability between the software detailed design and the software requirements.
      
      .. note::
      
      Redundancy should be avoided by establishing a combination of these approaches.
      
      .. note::
      
      Examples for tracing a software unit in the detailed design to a software requirement directly
      are communication matrices or basis software aspects such as a list of diagnosis identifiers inherent
      in an Autosar configuration.
      
      .. note::
      
      Bidirectional traceability supports consistency, and facilitates impact analysis of change
      requests, and demonstration of verification coverage. Traceability alone, e.g., the existence of links,
      does not necessarily mean that the information is consistent with each other.
    fields:
      links: std_req__aspice_40__iic-13-51
  - id: STD_REQ__ASPICE_40__SWE-3-BP5
    type: std-req
    title: "SWE.3.BP5: Communicate agreed software detailed design and developed software units"
    status: approved
    description: |
      Communicate the agreed software detailed design and developed software units to all
      affected parties.
    fields:
      links: std_req__aspice_40__iic-13-52
  - id: STD_REQ__ASPICE_40__SWE-4-BP1
    type: std-req
    title: "SWE.4.BP1: Specify software unit verification measures"
    status: approved
    description: |
      Specify verification measures for
      each software unit defined in the software detailed design, including
      - pass/fail criteria for verification measures,
      - entry and exit criteria for verification measures, and
      - the required verification infrastructure.
      
      .. note::
      
      Examples for unit verification measures are static analysis, code reviews, and unit testing.
      
      .. note::
      
      Static analysis can be done based on MISRA rulesets and other coding standards.
    fields:
      links: std_req__aspice_40__iic-08-60
  - id: STD_REQ__ASPICE_40__SWE-4-BP2
    type: std-req
    title: "SWE.4.BP2: Select software unit verification measures"
    status: approved
    description: |
      Document the selection of
      verification measures considering selection criteria including criteria for regression verification.
      The documented selection of verification measures shall have sufficient coverage according to
      the release scope.
    fields:
      links: std_req__aspice_40__iic-08-58
  - id: STD_REQ__ASPICE_40__SWE-4-BP3
    type: std-req
    title: "SWE.4.BP3: Verify software units"
    status: approved
    description: |
      Perform software unit verification using the selected
      verification measures. Record the verification results including pass/fail status and
      corresponding verification measure data.
      
      .. note::
      
      See SUP.9 for handling of verification results that deviate from expected results
    fields:
      links: std_req__aspice_40__iic-03-50;std_req__aspice_40__iic-15-52
  - id: STD_REQ__ASPICE_40__SWE-4-BP4
    type: std-req
    title: "SWE.4.BP4: Ensure consistency and establish bidirectional traceability"
    status: approved
    description: |
      Ensure
      consistency and establish bidirectional traceability between verification measures and the
      software units defined in the detailed design. Establish bidirectional traceability between the
      verification results and the verification measures.
      
      .. note::
      
      Bidirectional traceability supports consistency, and facilitates impact analysis of change
      requests, and demonstration of verification coverage. Traceability alone, e.g., the existence of links,
      does not necessarily mean that the information is consistent with each other.
    fields:
      links: std_req__aspice_40__iic-13-51
  - id: STD_REQ__ASPICE_40__SWE-4-BP5
    type: std-req
    title: "SWE.4.BP5: Summarize and communicate results"
    status: approved
    description: |
      Summarize the results of software unit
      verification and communicate them to all affected parties.
      
      .. note::
      
      Providing all necessary information from the test case execution in a summary enables other
      parties to judge the consequences.
    fields:
      links: std_req__aspice_40__iic-13-52
  - id: STD_REQ__ASPICE_40__SWE-5-BP1
    type: std-req
    title: "SWE.5.BP1: Specify software integration verification measures"
    status: approved
    description: |
      Specify verification
      measures, based on a defined sequence and preconditions for the integration of software
      elements, against the defined static and dynamic aspects of the software architecture, including
      - techniques for the verification measures;
      - pass/fail criteria for verification measures;
      - entry and exit criteria for verification measures, and
      - the required verification infrastructure and environment setup.
      
      .. note::
      
      Examples on which the software integration verification measures may focus on are the
      correct dataflow and dynamic interaction between software components together with their timing
      dependencies, the correct interpretation of data by all software components using an interface, and
      the compliance to resource consumption objectives.
      
      .. note::
      
      The software integration verification measure may be supported by using hardware debug
      interfaces or simulation environments (e.g, Software-in-the-Loop-Simulation).
    fields:
      links: std_req__aspice_40__iic-08-60
  - id: STD_REQ__ASPICE_40__SWE-5-BP2
    type: std-req
    title: "SWE.5.BP2: Specify verification measures for verifying software component behavior"
    status: approved
    description: |
      Specify verification measures for software component verification against the defined software
      components’ behavior and their interfaces in the software architecture, including
      - techniques for the verification measures,
      - entry and exit criteria for verification measures,
      - pass/fail criteria for verification measures, and
      - the required verification infrastructure and environment setup.
      
      .. note::
      
      Verification measures are related to software components but not to the software units since
      software unit verification is addressed in the process :doc:`SWE.4 Software Unit Verification <swe.4>`.
    fields:
      links: std_req__aspice_40__iic-08-60
  - id: STD_REQ__ASPICE_40__SWE-5-BP3
    type: std-req
    title: "SWE.5.BP3: Select verification measures"
    status: approved
    description: |
      Document the selection of integration verification
      measures for each integration step considering selection criteria including criteria for regression
      verification. The documented selection of verification measures shall have sufficient coverage
      according to the release scope.
      
      .. note::
      
      Examples for selection criteria can be the need for continuous integration /continuous
      development regression verification (due to e.g, changes to the software architectural or detailed
      design), or the intended use of the delivered product release (e.g, test bench, test track, public road
      etc.).
    fields:
      links: std_req__aspice_40__iic-08-58
  - id: STD_REQ__ASPICE_40__SWE-5-BP4
    type: std-req
    title: "SWE.5.BP4: Integrate software elements and perform integration verification"
    status: approved
    description: |
      Integrate the
      software elements until the software is fully integrated according to the specified interfaces and
      interactions between the Software elements, and according to the defined sequence and
      defined preconditions. Perform the selected integration verification measures. Record the
      verification measure data including pass/fail status and corresponding verification measure data.
      
      .. note::
      
      Examples for preconditions for starting software integration are qualification of pre-existing
      software components, off-the-shelf software components, open-source-software, or auto-code
      generated software.
      
      .. note::
      
      Defined preconditions may allow e.g, big-bang-integration of all software components,
      continuous integration, as well as stepwise integration (e.g, across software units and/or software
      components up to the fully integrated software) with accompanying verification measures.
      
      .. note::
      
      See SUP.9 for handling deviations of verification results deviate expected results.
    fields:
      links: std_req__aspice_40__iic-06-50;std_req__aspice_40__iic-01-03;std_req__aspice_40__iic-01-50
  - id: STD_REQ__ASPICE_40__SWE-5-BP5
    type: std-req
    title: "SWE.5.BP5: Perform software component verification"
    status: approved
    description: |
      Perform the selected verification
      measures for verifying software component behavior. Record the verification results including
      pass/fail status and corresponding verification measure data.
      
      .. note::
      
      See SUP.9 for handling deviations of verification results deviate expected results.
    fields:
      links: std_req__aspice_40__iic-03-50;std_req__aspice_40__iic-15-52
  - id: STD_REQ__ASPICE_40__SWE-5-BP6
    type: std-req
    title: "SWE.5.BP6: Ensure consistency and establish bidirectional traceability"
    status: approved
    description: |
      Ensure
      consistency and establish bidirectional traceability between verification measures and the static
      and dynamic aspects of the software architecture and detailed design. Establish bidirectional
      traceability between verification results and verification measures.
      
      .. note::
      
      Bidirectional traceability supports consistency, and facilitates impact analysis of change
      requests, and demonstration of verification coverage. Traceability alone, e.g., the existence of links,
      does not necessarily mean that the information is consistent with each other.
    fields:
      links: std_req__aspice_40__iic-13-51
  - id: STD_REQ__ASPICE_40__SWE-5-BP7
    type: std-req
    title: "SWE.5.BP7: Summarize and communicate results"
    status: approved
    description: |
      Summarize the software component
      verification and the software integration verification results and communicate them to all affected
      parties.
      
      .. note::
      
      Providing all necessary information from the test case execution in a summary enables
      other parties to judge the consequences.
    fields:
      links: std_req__aspice_40__iic-13-52
  - id: STD_REQ__ASPICE_40__SWE-6-BP1
    type: std-req
    title: "SWE.6.BP1: Specify verification measures for software verification"
    status: approved
    description: |
      Specify the verification
      measures for software verification suitable to provide evidence for compliance of the integrated
      software with the functional and non-functional information in the software requirements,
      including
      - techniques for the verification measures,
      - pass/fail criteria for verification measures,
      - a definition of entry and exit criteria for the verification measures,
      - necessary sequence of verification measures, and
      - the required verification infrastructure and environment setup.
      
      .. note::
      
      The selection of appropriate techniques for verification measures may depend on the
      content of the respective software requirement (e.g, boundary values and equivalence classes for
      data range-oriented requirements, positive/sunny-day-test vs. negative testing such as fault
      injection), or on requirements-based testing vs. “error guessing based on knowledge or experience”.
    fields:
      links: std_req__aspice_40__iic-08-60
  - id: STD_REQ__ASPICE_40__SWE-6-BP2
    type: std-req
    title: "SWE.6.BP2: Select verification measures"
    status: approved
    description: |
      Document the selection of verification measures
      considering selection criteria including criteria for regression verification. The documented
      selection of verification measures shall have sufficient coverage according to the release scope.
      
      .. note::
      
      Examples for selection criteria can be prioritization of requirements, continuous
      development, the need for regression verification (due to e.g., changes to the software
      requirements), or the intended use of the delivered product release (test bench, test track, public
      road etc.)
    fields:
      links: std_req__aspice_40__iic-08-58
  - id: STD_REQ__ASPICE_40__SWE-6-BP3
    type: std-req
    title: "SWE.6.BP3: Verify the integrated software"
    status: approved
    description: |
      Perform the verification of the integrated software
      using the selected verification measures. Record the verification results including pass/fail status
      and corresponding verification measure data.
      
      .. note::
      
      See SUP.9 for handling verification results that deviate from expected results.
    fields:
      links: std_req__aspice_40__iic-03-50;std_req__aspice_40__iic-15-52
  - id: STD_REQ__ASPICE_40__SWE-6-BP4
    type: std-req
    title: "SWE.6.BP4: Ensure consistency and establish bidirectional traceability"
    status: approved
    description: |
      Ensure
      consistency and establish bidirectional traceability between verification measures and software
      requirements. Establish bidirectional traceability between verification results and verification
      measures.
      
      .. note::
      
      Bidirectional traceability supports consistency, and facilitates impact analysis of change
      requests, and demonstration of verification coverage. Traceability alone, e.g., the existence of links,
      does not necessarily mean that the information is consistent with each other.
    fields:
      links: std_req__aspice_40__iic-13-51
  - id: STD_REQ__ASPICE_40__SWE-6-BP5
    type: std-req
    title: "SWE.6.BP5: Summarize and communicate results"
    status: approved
    description: |
      Summarize the software verification
      results and communicate them to all affected parties.
      
      .. note::
      
      Providing all necessary information from the test case execution in a summary enables other
      parties to judge the consequences.
    fields:
      links: std_req__aspice_40__iic-13-52
