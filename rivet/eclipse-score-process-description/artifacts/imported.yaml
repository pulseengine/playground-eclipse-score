  - id: GD_REQ__ARCH_BUILD_BLOCKS
    type: guidance
    title: Structuring of the architectural elements
    status: approved
    tags: [done_automation, architecture_design, "eclipse:gd_req"]
    description: |
      Following architectural elements shall be defined on the respective hierarchical level:
      
      * Logical Level
      
      * Feature (feat)
      * Feature (feature_arc_sta)
      * Feature (feature_arc_dyn)
      * Logical Interface (logic_arc_int)
      * Logical Interface Operation (logic_arc_int_op)
      
      * Component Level
      
      * Component (comp)
      * Component (comp_arc_sta)
      * Component (comp_arc_dyn)
      * Interface (real_arc_int)
      * Interface Operation (real_arc_int_op)
      
      * Module
      
      * SW Module (mod)
    links:
      - type: complies
        target: STD_REQ__ISO26262__SUPPORT_6431
      - type: complies
        target: STD_REQ__ISO26262__SUPPORT_6432
      - type: complies
        target: STD_REQ__ASPICE_40__IIC-01-03
      - type: complies
        target: STD_REQ__ASPICE_40__IIC-01-50
      - type: fulfils-process-req
        target: WF__CR_MT_FEATARCH
      - type: fulfils-process-req
        target: WF__CR_MT_COMPARCH
