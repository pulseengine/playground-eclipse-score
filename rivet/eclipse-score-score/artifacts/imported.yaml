  - id: FEAT_REQ__ABI_COMPATIBLE_DATA_TYPES__PRV_ABV
    type: feat-req
    title: "Provide AbiVec<T,N>"
    status: approved
    description: |
      An ABI-compatible ``AbiVec<T, N>`` type shall be provided in both C++ and Rust with the specified layout.
      
      .. code-block:: rust
      
      #[repr(C)]
      pub struct AbiVec<T, const N: usize> {
      len: u32,
      elements: [T; N],
      }
      
      .. code-block:: cpp
      
      template<typename T, std::uint32_t N>
      struct AbiVec {
      private:
      std::uint32_t len;
      T elements[N];
      };
    fields:
      req-type: Functional
      security: "NO"
      safety-level: QM
    links:
      - type: satisfies
        target: STKH_REQ__COMMUNICATION__ABI_COMPATIBLE
