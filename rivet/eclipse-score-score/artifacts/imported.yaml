  - id: FEAT_REQ__ABI_COMPATIBLE_DATA_TYPES__BOOL_SZ
    type: feat-req
    title: Restrict boolean size
    status: approved
    description: |
      For ABI compatibility, the implementation shall restrict boolean types to one byte (``bool`` in Rust) and to the bit patterns ``0x00`` and ``0x01``.
    fields:
      req-type: Functional
      security: "NO"
      safety-level: QM
    links:
      - type: satisfies
        target: STKH_REQ__COMMUNICATION__ABI_COMPATIBLE
  - id: FEAT_REQ__ABI_COMPATIBLE_DATA_TYPES__INT_FIX
    type: feat-req
    title: Fixed-width integers
    status: approved
    description: |
      For ABI compatibility, all integer types shall use fixed-width definitions (``uN``/``iN`` in Rust; ``std::uintN_t``/``std::intN_t`` in C++), for N ∈ {8, 16, 32, 64}.
    fields:
      req-type: Functional
      security: "NO"
      safety-level: QM
    links:
      - type: satisfies
        target: STKH_REQ__COMMUNICATION__ABI_COMPATIBLE
  - id: FEAT_REQ__ABI_COMPATIBLE_DATA_TYPES__FLT_SZ
    type: feat-req
    title: Limit floating-point sizes
    status: approved
    description: |
      For ABI compatibility, floating-point types shall be limited to 32-bit (``f32`` in Rust / ``float`` in C++) and 64-bit (``f64`` in Rust / ``double`` in C++); all floating-point representations shall be compliant with IEEE 754.
    fields:
      req-type: Functional
      security: "NO"
      safety-level: QM
    links:
      - type: satisfies
        target: STKH_REQ__COMMUNICATION__ABI_COMPATIBLE
  - id: FEAT_REQ__ABI_COMPATIBLE_DATA_TYPES__CHAR
    type: feat-req
    title: Characters
    status: approved
    description: |
      For ABI compatibility, the Unicode character type shall use fixed-width definitions (``char`` in Rust; wrapper around ``std::uint32_t`` in C++), and shall restrict values to the ranges ``0x0`` to ``0xD7FF`` and ``0xE000`` to ``0x10FFFF``.
    fields:
      req-type: Functional
      security: "NO"
      safety-level: QM
    links:
      - type: satisfies
        target: STKH_REQ__COMMUNICATION__ABI_COMPATIBLE
  - id: FEAT_REQ__ABI_COMPATIBLE_DATA_TYPES__ARR_FIX
    type: feat-req
    title: Fixed-size arrays
    status: approved
    description: |
      For ABI compatibility, fixed-size arrays shall be declared as ``[T; N]`` in Rust and with a wrapper around ``T[N]`` to perform bounds-checking in C++, where T itself conforms to the ABI compatibility rules.
    fields:
      req-type: Functional
      security: "NO"
      safety-level: QM
    links:
      - type: satisfies
        target: STKH_REQ__COMMUNICATION__ABI_COMPATIBLE
  - id: FEAT_REQ__ABI_COMPATIBLE_DATA_TYPES__ST_TPL
    type: feat-req
    title: Struct and tuple ABI layout
    status: approved
    description: |
      For ABI compatibility, tuples and structs shall preserve field order, use ``#[repr(C)]`` in Rust, and be ``standard_layout`` in C++ (no inheritance or virtuals).
    fields:
      req-type: Functional
      security: "NO"
      safety-level: QM
    links:
      - type: satisfies
        target: STKH_REQ__COMMUNICATION__ABI_COMPATIBLE
  - id: FEAT_REQ__ABI_COMPATIBLE_DATA_TYPES__ENUM_UDR
    type: feat-req
    title: Explicit enum representation
    status: approved
    description: |
      For ABI compatibility, enums shall have an explicit, fixed underlying representation (e.g. ``#[repr(u8)]`` in Rust; ``enum class E : std::uint8_t`` in C++).
    fields:
      req-type: Functional
      security: "NO"
      safety-level: QM
    links:
      - type: satisfies
        target: STKH_REQ__COMMUNICATION__ABI_COMPATIBLE
  - id: FEAT_REQ__ABI_COMPATIBLE_DATA_TYPES__NOP_MT
    type: feat-req
    title: Disallow pointers and metadata
    status: approved
    description: |
      For ABI compatibility, types shall not contain absolute pointers, references, slices, function pointers, vtables, or any language-specific metadata.
    fields:
      req-type: Functional
      security: "NO"
      safety-level: QM
    links:
      - type: satisfies
        target: STKH_REQ__COMMUNICATION__ABI_COMPATIBLE
  - id: FEAT_REQ__ABI_COMPATIBLE_DATA_TYPES__COMPABI
    type: feat-req
    title: Compiler-agnostic ABI
    status: approved
    description: |
