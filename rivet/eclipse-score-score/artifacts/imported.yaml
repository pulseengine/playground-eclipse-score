    type: doc
    title: result FMEA
    status: approved
    tags: ["eclipse:document"]
    fields:
      safety-level: ASIL_B
      security: "NO"
    links:
      - type: realizes
        target: WP__SW_COMPONENT_FMEA
  - id: COMP_SAF_FMEA__RESULT__ERROR_CODE
    type: fmea-entry
    title: Result Error Code Cross-Domain Misinterpretation
    status: approved
    tags: ["eclipse:comp_saf_fmea"]
    description: |
      If the user relies on the error code not only for diagnostic purposes but for selecting an error reaction path,
      misinterpreting the code under a wrong domain could lead to an incorrect safety-relevant decision.
      An Assumption of Use shall ensure the user verifies the error domain before interpreting the error code.
    fields:
      fault-id: CO_01_01
      effect: "When retrieving error information, the error code is returned as a domain-agnostic integer. If the user interprets this code under a different error domain than the one that produced it, the error is misidentified, potentially leading to incorrect error reaction."
      mitigation-issue: "https://github.com/eclipse-score/score/issues/2880"
      sufficient: "no"
    links:
      - type: violates
        target: COMP_ARC_DYN__BASELIBS__RESULT
  - id: COMP_SAF_FMEA__RESULT__ERROR_MESSAGE_LIFE
    type: fmea-entry
    title: Result Error Message Lifetime Violation
    status: approved
    tags: ["eclipse:comp_saf_fmea"]
    description: |
      The existing Assumption of Use for resource lifetime addresses the validity of error domain objects
      and referenced resources. However, it does not explicitly cover the user-provided error message,
      which is equally subject to lifetime constraints. The AoU should be extended to explicitly include the error message data,
      or a separate AoU should be established for it.
    fields:
      fault-id: MF_01_05
      effect: "The error message provided during error construction is stored as a non-owning reference. If the referenced data is no longer valid when the user retrieves the error message, accessing it results in undefined behavior."
      mitigation-issue: "https://github.com/eclipse-score/score/issues/2880"
      sufficient: "no"
    links:
      - type: violates
        target: COMP_ARC_DYN__BASELIBS__RESULT
      - type: is-mitigated-by
        target: AOU_REQ__RESULT__RESOURCE_LIFETIME
  - id: COMP_SAF_FMEA__RESULT__UNCHECKED
    type: fmea-entry
    title: Result Unchecked Value or Error Access
    status: approved
    tags: ["eclipse:comp_saf_fmea"]
    description: |
      If the user accesses the value or the error without first verifying the state of the result,
      the program will deterministically terminate. The provided Assumptions of Use require the user to check and handle both states before access.
    fields:
      fault-id: MF_01_06
      effect: "If the user calls value without the result containing a value, or calls error without the result containing an error, the program will terminate. This may occur when the user does not check the state of the result before accessing it."
      sufficient: "yes"
    links:
      - type: violates
        target: COMP_ARC_DYN__BASELIBS__RESULT
      - type: is-mitigated-by
        target: AOU_REQ__RESULT__VALUE_HANDLING
      - type: is-mitigated-by
        target: AOU_REQ__RESULT__ERROR_REACTION
  - id: COMP_SAF_FMEA__RESULT__STOP_USER
    type: fmea-entry
    title: Result Stop User
    status: approved
    tags: ["eclipse:comp_saf_fmea"]
    description: |
      The Result library invokes user-provided operations synchronously during transformation of values or errors.
      Ensuring these operations terminate is outside the scope of the library and is the responsibility of the user via program flow monitoring,
      as covered by the referenced platform-level Assumption of Use.
    fields:
      fault-id: EX_01_06
      effect: "The user provides a transformation or error handling operation to the Result library. If this operation does not terminate (e.g., infinite loop), the calling execution is blocked indefinitely."
      sufficient: "yes"
    links:
      - type: violates
        target: COMP_ARC_DYN__BASELIBS__RESULT
      - type: is-mitigated-by
        target: AOU_REQ__PLATFORM__FLOW_MONITORING
