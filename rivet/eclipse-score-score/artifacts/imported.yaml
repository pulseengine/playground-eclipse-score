    tags: ["eclipse:feat_saf_dfa"]
    description: |
      All the baselibs components have to be developed to ASIL_B standard to maintain Freedom From Interference,
      all blocks should be detected by unit testing.
    fields:
      failure-id: UI_01_06
      effect: Using application is blocked from execution and thus cannot fulfill its safety function
