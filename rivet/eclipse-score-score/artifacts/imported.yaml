  - id: FEAT_SAF_DFA__BASELIBS__MEMORY_ACCESS
    type: dfa-entry
    title: memory access
    status: approved
    tags: ["eclipse:feat_saf_dfa"]
    description: |
      All the baselibs components have to be developed to ASIL_B standard to maintain Freedom From Interference,
      out of bounds access should be detected by unit testing/sanitizers.
    fields:
      failure-id: UI_01_02
      effect: memory of using component may be corrupted leading to safety requirement violation
      mitigation-issue: "https://github.com/eclipse-score/score/issues/2816"
      sufficient: "no"
    links:
      - type: violates
        target: FEAT_ARC_STA__BASELIBS__STATIC_VIEW_ARCH
  - id: FEAT_SAF_DFA__BASELIBS__LOCKED_RESSOURCE
    type: dfa-entry
    title: locked ressource
    status: approved
    tags: ["eclipse:feat_saf_dfa"]
    description: |
      Only components "filesystem" and "memory_shared" should have the problem ("bitmanipulation" should not be affected due to shortness of execution)
      "memory_shared" cares for this by above linked feature requirement and :need:`comp_req__memory__atomic_ops`.
      "filesystem" component may fail on this but this is covered by common platform aou linked above.
    fields:
      failure-id: UI_01_04
      effect: Deadlock/Livelock leads to stalling of the execution
      sufficient: "yes"
    links:
      - type: violates
        target: FEAT_ARC_STA__BASELIBS__STATIC_VIEW_ARCH
      - type: is-mitigated-by
        target: FEAT_REQ__BASELIBS__MEMORY_LIBRARY
      - type: is-mitigated-by
        target: AOU_REQ__PLATFORM__FLOW_MONITORING
  - id: FEAT_SAF_DFA__BASELIBS__CONC_FILE_ACCESS
    type: dfa-entry
    title: concurrent file access
    status: approved
    tags: ["eclipse:feat_saf_dfa"]
    description: |
      The user has to care for concurrent file access. This is not covered by the filesytem library.
    fields:
      failure-id: SR_01_02
      effect: Concurrent file access may lead to corruption of the file
      sufficient: "yes"
    links:
      - type: violates
        target: FEAT_ARC_STA__BASELIBS__STATIC_VIEW_ARCH
      - type: is-mitigated-by
        target: AOU_REQ__FILESYSTEM__THREAD_SAFETY
  - id: FEAT_SAF_DFA__BASELIBS__CONC_MEMORY_ACCESS
