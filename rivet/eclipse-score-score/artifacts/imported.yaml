      The supplier shall provide a contact point for integration assistance.
    fields:
      req-type: Non-Functional
      security: "YES"
      safety-level: QM
  - id: AOU_REQ__PLATFORM__OS_INTEGRATION_MANUAL
    type: aou-req
    title: Integration manual
    status: approved
    description: |
      The supplier shall provide an integration manual.
    fields:
      req-type: Non-Functional
      security: "YES"
      safety-level: QM
  - id: AOU_REQ__PLATFORM__BUG_INTERFACE
    type: aou-req
    title: Bug interface
    status: approved
    description: |
      The supplier shall provide a bug reporting interface.
      
      Note: There is no guarantee provided to fix these bugs.
    fields:
      req-type: Non-Functional
      security: "YES"
      safety-level: QM
  - id: AOU_REQ__PLATFORM__BAZEL_TOOLING
    type: aou-req
    title: Bazel tooling
    status: approved
    description: |
      The supplier shall provide tools for Bazel to be able to build the S-CORE SW-platform with the external SW element
      and support the run and test of the S-CORE SW-platform.
    fields:
      req-type: Non-Functional
      security: "YES"
      safety-level: QM
  - id: AOU_REQ__PLATFORM__BUG_FIXING
    type: aou-req
    title: Bug fixing
    status: approved
    description: |
      The supplier shall fix bugs reported in a predictable manner.
      
      Note: For OSS community providing an external SW element this requirement could be covered by analyzing how bugs were treated in the past. For companies by the definition of a service level process.
    fields:
      req-type: Non-Functional
      security: "YES"
      safety-level: QM
  - id: AOU_REQ__PLATFORM__TESTING
    type: aou-req
    title: SW-platform testing
    status: approved
    tags: [user]
    description: |
      The system integrator shall run the tests provided by S-CORE (platform, feature, component and Unit level for their selected S-CORE modules) on their selected OS/Hypervisor/HW combination,
      or provide equivalent argumentation.
      
      Note1: S-CORE will run these tests for one or more reference OS/Hypervisor/HW combination, if not all passing, remaining issues are documented in release notes.
      
      Note2: Equivalent argumentation could be for example that the test environments for unit tests would be sufficiently equal in S-CORE project and at the integrator.
    fields:
      req-type: Non-Functional
      security: "YES"
      safety-level: QM
  - id: AOU_REQ__PLATFORM__BUG_REPORT
    type: aou-req
    title: SW-platform integration bug reporting
    status: approved
    tags: [user]
    description: |
      The system integrator shall report the bugs found during integration of the S-CORE SW-platform on their selected OS/Hypervisor/HW combination to the external SW element supplier and S-CORE for analysis.
    fields:
      req-type: Non-Functional
      security: "YES"
      safety-level: QM
  - id: AOU_REQ__PLATFORM__LEVELS
    type: aou-req
    title: Integration levels
    status: approved
    tags: [user]
    description: |
      The supplier and system integrator shall fulfill all the levels AoUs in a safe way (i.e. the "safety" attribute will be raised to the level in this AoU).
      
      Note: This includes for example :need:`aou_req__platform__bazel_tooling`, :need:`aou_req__platform__bug_fixing`
    fields:
      req-type: Non-Functional
      security: "YES"
      safety-level: ASIL_B
  - id: AOU_REQ__PLATFORM__SAFETY_AOU
    type: aou-req
    title: Safety AoU
    status: approved
    description: |
      The supplier shall provide Assumptions of (safe) Use for the external SW element.
      
      Note: This may be part of an external SW element's safety manual.
    fields:
      req-type: Non-Functional
      security: "YES"
      safety-level: ASIL_B
  - id: AOU_REQ__PLATFORM__SAFETY_FUNCTIONS
    type: aou-req
    title: Safety functions
    status: approved
    description: |
      The supplier shall provide a list of safe external SW element functions.
    fields:
      req-type: Non-Functional
      security: "YES"
      safety-level: ASIL_B
  - id: AOU_REQ__PLATFORM__SAFETY_ANOMALY
    type: aou-req
    title: Safety anomaly reporting
    status: approved
    description: |
      The supplier shall perform safety anomaly reporting on critical bugs in the external SW element.
      
      Note: This could be fulfilled by listing per release version all known and user reported bugs which affect the safe external SW element functions.
    fields:
      req-type: Non-Functional
      security: "YES"
      safety-level: ASIL_B
  - id: AOU_REQ__PLATFORM__SAFETY_MATCHING
    type: aou-req
    title: Safety matching
    status: approved
    tags: [user]
    description: |
      If the system using the SW-platform has safety goals, the system integrator shall integrate the SW-platform with external SW elements providing safety functions.
      This includes to make sure that the safety functions S-CORE SW-platform requires match with the ones provided by these external SW elements (as in :need:`aou_req__platform__safety_functions`).
      
      Note1: A list of safety functions needed from external SW elements is compiled by the S-CORE project here (:need:`aou_req__platform__os_safety_functions`).
      
      Note2: The integrator can expect that for the safe S-CORE reference integration (incl. OS and other external SW elements) this AoU is fulfilled by S-CORE SW-platform already, but without guarantee.
      
      Note3: This applies also if the system integrator would replace a S-CORE SW-platform element with another SW element which is external to S-CORE.
    fields:
      req-type: Non-Functional
      security: "YES"
      safety-level: ASIL_B
  - id: AOU_REQ__PLATFORM__SAFETY_INTEGRATION
    type: aou-req
    title: Safety integration
    status: approved
    tags: [user]
    description: |
      If the system using the SW-platform has safety goals, the system integrator shall make sure that the AoUs relevant for external SW element safety functions (as in :need:`aou_req__platform__safety_aou`) are fulfilled by the S-CORE SW-platform.
      
      Note1: This could be done by contributing the required updates to the S-CORE project if S-CORE elements are affected.
      
      Note2: The system integrator can expect that for the safe S-CORE reference integration (incl. OS and other external SW elements) this AoU is fulfilled by S-CORE SW-platform already, but without guarantee.
      
      Note3: This applies also if the system integrator would replace a S-CORE SW-platform element with another SW element which is external to S-CORE.
    fields:
      req-type: Non-Functional
      security: "YES"
      safety-level: ASIL_B
  - id: AOU_REQ__PLATFORM__TEST_COMPLETION
    type: aou-req
    title: SW-platform test completion
    status: approved
    tags: [user]
    description: |
      If the system using the SW-platform has safety goals, the system integrator shall check for correctness and completeness of SW-platform testing and add verification where needed.
      
      Note: The SW-platform integtion tests provided by S-CORE for :need:`aou_req__platform__testing` are for demonstration purpose only,
      as described in the tailoring section of :need:`doc__score_platform_safety_plan` and thus do not claim correctness and completeness.
    fields:
      req-type: Non-Functional
      security: "YES"
      safety-level: ASIL_B
  - id: AOU_REQ__PLATFORM__INTEGRATION_SAFETY_ANOMALY
    type: aou-req
    title: Integrator safety anomaly reporting
    status: approved
    tags: [user]
    description: |
      If the system using the SW-platform has safety goals, the system integrator shall perform safety anomaly reporting taking into account also the reporting of all the components they integrate.
      
      Note: This includes all the modules of the S-CORE SW platform used by the system integrator.
      The relevant safety critical bugs or safety anomalies are published by S-CORE as defined in the :need:`doc__platform_problem_resolution_plan`.
    fields:
      req-type: Non-Functional
      security: "YES"
      safety-level: ASIL_B
  - id: AOU_REQ__PLATFORM__NO_EXCEPTIONS
    type: aou-req
    title: Avoidance of Exceptions
    status: approved
    tags: [user]
    description: |
      All applications using the SW-platform shall not handle exceptions.
      
      Note: Exceptions create additional overhead which may be a safety risk. Therefore, all exceptions are expected to lead directly to a termination of the application causing the exception.
      This is supported by the library safecpp/aborts_upon_exception supplied by S-CORE "base libraries" feature.
    fields:
      req-type: Functional
      security: "YES"
      safety-level: ASIL_B
  - id: AOU_REQ__PLATFORM__NO_HEAP_ALLOC_AFTER_INIT
    type: aou-req
    title: Avoidance of heap allocations after initialization
    status: approved
    tags: [user]
    description: |
      All applications using the SW-platform should not perform heap allocations after initialization.
      
      Note: Heap allocations have non-deterministic timing behavior and may cause memory fragmentation, which may be a safety risk.
      Therefore, all heap allocations are expected to be performed during initialization of the application.
      Any deviation from this expectation should be justified in the safety concept of the application.
    fields:
      req-type: Functional
      security: "YES"
      safety-level: ASIL_B
  - id: AOU_REQ__PLATFORM__ERROR_REACTION
    type: aou-req
    title: Error Reaction
    status: approved
    tags: [user]
    description: |
      Safety applications using the SW-platform shall read error information from the requested S-CORE functions and perform an appropriate reaction.
      
      Note: For many errors detected by SW-platform elements there could be mitigation actions to be applied by the user application.
      So the SW-platform reports the errors to the user application and does not stop execution as a standard reaction. See :need:`stkh_req__dependability__safe_state`.
    fields:
      req-type: Functional
      security: "YES"
      safety-level: ASIL_B
  - id: AOU_REQ__PLATFORM__NO_MIXED_ASIL
    type: aou-req
    title: No mixed ASIL
    status: approved
    tags: [user]
    description: |
      Safety application components running in one POSIX process shall implement the highest ASIL of their assigned requirements.
    fields:
      req-type: Functional
      security: "YES"
      safety-level: ASIL_B
  - id: AOU_REQ__PLATFORM__FLOW_MONITORING
    type: aou-req
    title: Program Flow Monitoring
    status: approved
    tags: [user]
    description: |
      Safety applications using the SW-platform shall use program flow monitoring to detect run time errors or explain in their safety concept why they do not need this.
      
      Note1: Reasons for not needing program flow monitoring could be an OS scheduler with timing and execution guarantees.
      Or that in case of non/late execution of the application the safety integrity of the system is not affected.
      
      Note2: The SW-Platform supports this - see :need:`stkh_req__dependability__safety_features_1`
    fields:
      req-type: Functional
      security: "YES"
      safety-level: ASIL_B
  - id: AOU_REQ__PLATFORM__HARDWARE_SAFETY
    type: aou-req
    title: Safe HW platform
    status: approved
    tags: [environment]
    description: |
      If the system using the SW-platform has safety goals, the system shall provide state-of-the art hardware safety mechanisms, namely
      
      - :need:`stkh_req__dependability__safety_features_3`
      - :need:`stkh_req__dependability__safety_features_4`
      - :need:`stkh_req__dependability__safety_features_5`
      - :need:`stkh_req__dependability__safety_features_6`
      - :need:`stkh_req__dependability__safety_features_7`
      - :need:`stkh_req__dependability__safety_features_8`
      - :need:`stkh_req__dependability__safety_features_10`
      
      Note2: These safety mechanisms are mostly OS/Hypervisor/HW specific, so the system integrator can only expect S-CORE support for the reference OS/Hypervisor/HW combination.
    fields:
      req-type: Functional
      security: "YES"
      safety-level: ASIL_B
  - id: AOU_REQ__PLATFORM__EXTERNAL_HEALTH_MANAGEMENT
    type: aou-req
    title: External Health Management
    status: approved
    tags: [environment]
    description: |
      If the system using the SW-platform has safety goals, the system shall provide an external health management element which is able to initiate a safe system state.
      
      Note: This can be an "External Hardware Watchdog" and/or "Voltage Moditoring" (see :need:`stkh_req__dependability__safety_features_10`)
    fields:
      req-type: Functional
      security: "YES"
      safety-level: ASIL_B
  - id: AOU_REQ__PLATFORM__PROCESS_ISOLATION
    type: aou-req
    title: Process Isolation
    status: approved
    tags: [environment]
    description: |
      If the system using the SW-platform has safety goals, the used operating system shall offer POSIX processes isolation.
      This shall cover memory isolation. Timing isolation may be covered.
    fields:
      req-type: Functional
      security: "YES"
      safety-level: ASIL_B
  - id: AOU_REQ__PLATFORM__OS_SAFETY_FUNCTIONS
    type: aou-req
    title: OS safety functions
    status: approved
    tags: [environment]
    description: |
      If the system using the SW-platform has safety goals, the used os module shall offer the following safety related functions:
      
      - configuration of HW safety mechanisms as in :need:`aou_req__platform__hardware_safety`
      - startup of OS
      - loading and starting of processes
      - management and restriction of process privileges
      - process execution (including starting and stopping threads/processes according to priorities, mangement of interrupts and exceptions)
      - volatile memory management (including static, dynamic memory allocation and access)
      - filesystem access (data integrity of read-only-memory)
      - DMA
      - IPC communication primitives (shared memory and message passing)
      - C++ standard library (according to ISO 14882)
      - C library
      - math library
      - high precision time source (HW synchronized)
    fields:
      req-type: Functional
      security: "YES"
      safety-level: ASIL_B
  - id: DOC__STAKEHOLDER_REQUIREMENTS
    type: doc
    title: SW-platform stakeholder requirements
    status: draft
    tags: ["eclipse:document"]
    fields:
      security: "YES"
      safety-level: ASIL_B
    links:
      - type: realizes
        target: WP__REQUIREMENTS_STKH
  - id: STKH_REQ__OVERALL_GOALS__REUSE_OF_APP_SOFT
    type: stkh-req
    title: Reuse of application software via managed APIs
    status: approved
    description: |
      The SW-platform shall enable the reuse of application software via a set of managed APIs.
      These APIs shall be developed via a well-defined life-cycle ensuring
      non-breaking changes.
    fields:
      req-type: Non-Functional
      security: "NO"
      safety-level: QM
      rationale: This is a usability constraint needed for long maintenance support
  - id: STKH_REQ__OVERALL_GOALS__ENABLE_COOPERATION
    type: stkh-req
    title: Enable cooperation via standardized APIs
    status: approved
    description: |
      The SW-platform shall where possible be based on existing standards (e.g. network protocols).
    fields:
      req-type: Non-Functional
      security: "NO"
      safety-level: QM
      rationale: To enable cooperation with other cooperation partners.
  - id: STKH_REQ__OVERALL_GOALS__VARIANT_MANAGEMENT
    type: stkh-req
    title: Variant management
    status: approved
    description: |
      The SW-platform shall provide variant management support.
      Variant management support shall enable users to ensure the
      compatibility of application software across vehicle variants and vehicle
      software releases.
    fields:
      req-type: Functional
      security: "NO"
      safety-level: QM
      rationale: tbd
  - id: STKH_REQ__OVERALL_GOALS__IP_PROTECTION
    type: stkh-req
    title: IP protection
    status: approved
    description: |
      The SW-platform shall support cooperation models, where partners do not
      want to disclose their intellectual property of applications to all other
      partners.
    fields:
      req-type: Non-Functional
      security: "NO"
      safety-level: QM
      rationale: tbd
  - id: STKH_REQ__FUNCTIONAL_REQ__FILE_BASED
    type: stkh-req
    title: File Based Configuration
    status: approved
    description: |
      The SW-platform shall support configuration of applications via files (e.g. yaml, json)
    fields:
      req-type: Functional
      security: "NO"
      safety-level: QM
      rationale: File based configuration allows changes without rebuilding the software.
  - id: STKH_REQ__FUNCTIONAL_REQ__SUPPORT_OF_STORE
    type: stkh-req
    title: Support of safe Key/Value store
    status: approved
    tags: [safety_mechanism]
    description: |
      The SW-platform shall provide towards the applications a safe key/value store.
      
      Note: This is part of 0.5 release and therefore can only support ASIL_B. Goal is ASIL_D.
    fields:
      req-type: Functional
      security: "NO"
      safety-level: ASIL_B
      rationale: Key/Value storage is a standard way to structure file based non-volatile memory access.
  - id: STKH_REQ__FUNCTIONAL_REQ__SAFE_CONFIG
    type: stkh-req
    title: Safe Configuration
    status: approved
    tags: [safety_mechanism]
    description: |
      The SW-platform shall support safe configuration.
      
      Note: This is part of 0.5 release and therefore can only support ASIL_B. Goal is ASIL_D.
    fields:
      req-type: Functional
      security: "NO"
      safety-level: ASIL_B
      rationale: Configuration files may hold safety relevant information.
  - id: STKH_REQ__FUNCTIONAL_REQ__SAFE_COMPUT
    type: stkh-req
    title: Safe Computation
    status: approved
    description: |
      The SW-platform shall support safe computation.
      
      Note: This is part of 0.5 release and therefore can only support ASIL_B. Goal is ASIL_D.
    fields:
      req-type: Functional
      security: "NO"
      safety-level: ASIL_B
      rationale: Safe systems require computations to be done in safe environments.
  - id: STKH_REQ__FUNCTIONAL_REQ__BASE_LIBRARIES
    type: stkh-req
    title: Base Libraries
    status: approved
    description: |
      The SW-platform shall provide a set of base libraries offering common functionality for SW-platform components.
    fields:
      req-type: Functional
      security: "YES"
      safety-level: QM
      rationale: "Common libraries reduce duplication, improve consistency and quality across components."
  - id: STKH_REQ__FUNCTIONAL_REQ__HARDWARE_COMPUT
    type: stkh-req
    title: Hardware Accelerated Computation
    status: approved
    description: |
      The SW-platform shall support computation accelerated by a Hardware accelerator.
    fields:
      req-type: Functional
      security: "NO"
      safety-level: QM
      rationale: High computation loads typically need to be speed up hardware acceleration e.g. in ADAS applications
  - id: STKH_REQ__FUNCTIONAL_REQ__DATA_PERSISTENCY
    type: stkh-req
    title: Data Persistency
    status: approved
    description: |
      The SW-platform shall support to store data on non-volatile memory e.g. disks, flash, etc.
    fields:
      req-type: Functional
      security: "NO"
      safety-level: QM
      rationale: Applications typically need to store data across power cycles.
  - id: STKH_REQ__FUNCTIONAL_REQ__OPERATING_SYSTEM
    type: stkh-req
    title: Operating System
    status: approved
    description: |
      The SW-platform shall support operating systems compliant with IEEE Std 1003.1 (2004 Edition or newer)
    fields:
      req-type: Non-Functional
      security: "NO"
      safety-level: QM
      rationale: This allows portability of SW-platform on POSIX compliant operating systems.
  - id: STKH_REQ__FUNCTIONAL_REQ__VIDEO_SUBSYSTEM
    type: stkh-req
    title: Video subsystem
    status: approved
    description: |
      The SW-platform shall provide an interface for pre-processing and
      distribution of camera data via the following mechanisms
      
      * PCIe Graphic streams
      * Shared Memory Graphic streams
      * Display Serial Interface Driver
      * APIX serialization driver
      * ISP Driver including correction and frame pre-processing CV library (lens distortion et. al.)
      * Sensor Streamer component (binding ISP Driver & pre-processing CV library)
    fields:
      req-type: Functional
      security: "NO"
      safety-level: QM
      rationale: tbd
  - id: STKH_REQ__FUNCTIONAL_REQ__COMP_SUBSYSTEM
    type: stkh-req
    title: Compute subsystem
    status: approved
    description: |
      The SW-platform shall provide the following frameworks towards the
      applications:
      
      * Math library: Eigen Blaze like safety enhanced math front-end library
      * Graphics and compute API: Vulkan GPU back-end and CPU (SIMD capable)-based compute libraries:
      
      * Deep Neural Network API:  (including pytorch, tensorflow conversion scripts)
      * Computer Vision API: e.g. like OpenCV
      * Linear algebra API: e.g. BLAS / Lapack
      * AVB Sensor streams
      * PCIe Sensor streams
      * Shared Memory Sensor streams
      * GSML serialized data
    fields:
      req-type: Functional
      security: "NO"
      safety-level: QM
      rationale: tbd
  - id: STKH_REQ__FUNCTIONAL_REQ__COMM_WITH_CONTROL
    type: stkh-req
    title: Communication with external MCUs/standby controllers
    status: approved
    description: |
      The SW-platform shall define protocols and concepts for the interaction with
      external micro-controllers for
      
      * board management
      * external supervision for safety and security functions
      * software update
      * debugging
      * feature activation
    fields:
      req-type: Functional
      security: "NO"
      safety-level: QM
      rationale: tbd
  - id: STKH_REQ__DEPENDABILITY__AUTOMOTIVE_SAFETY
    type: stkh-req
    title: Automotive Safety Integrity Level
    status: approved
    description: |
      The SW-platform shall support applications with an automotive safety
      integrity level up to ASIL-B.
      
      Note: This is part of 0.5 release and therefore can only support ASIL_B. Goal is ASIL_D.
    fields:
      req-type: Functional
      security: "NO"
      safety-level: ASIL_B
      rationale: The SW-platform shall be usable by safety relevant applications.
  - id: STKH_REQ__DEPENDABILITY__SAFETY_FEATURES_1
    type: stkh-req
    title: Health Management
    status: approved
    tags: [safety_mechanism]
    description: |
      The SW-platform shall implement Health Management (alive, deadline, logical supervision) for time and event based taskchains
    fields:
      req-type: Functional
      security: "YES"
      safety-level: ASIL_B
      rationale: Safety applications may have systematical errors which lead to violations in the control flow.
      valid-from: v1.0.0
  - id: STKH_REQ__DEPENDABILITY__SAFETY_FEATURES_2
    type: stkh-req
    title: E2E Protection
    status: approved
    tags: [safety_mechanism]
    description: |
      The SW-platform shall implement E2E Protection for communication
    fields:
      req-type: Functional
      security: "YES"
      safety-level: ASIL_B
      rationale: ECU external communication is using QM rated SW and HW which may currupt messages.
      valid-from: v1.0.0
  - id: STKH_REQ__DEPENDABILITY__SAFETY_FEATURES_3
    type: stkh-req
    title: HW Self-Test
    status: approved
    tags: [safety_mechanism]
    description: |
      The SW-platform shall support Built-in hardware self-tests
      
      Note: Support means here that a functionality offered by external SW (e.g. an OS) or HW may need to be configured and used.
    fields:
      req-type: Functional
      security: "YES"
      safety-level: ASIL_B
      rationale: "The processing HW used by the SW platform may have errors affecting computing, data and control flow."
      valid-from: v1.0.0
  - id: STKH_REQ__DEPENDABILITY__SAFETY_FEATURES_4
    type: stkh-req
    title: Safe Startup and Reset
    status: approved
    tags: [safety_mechanism]
    description: |
      The SW-platform shall implement and support Safe startup and reset paths
    fields:
      req-type: Functional
      security: "YES"
      safety-level: ASIL_B
      rationale: During startup and shutdown specific errors may occurr (e.g. inintialization errors due to insufficient resources).
      valid-from: v1.0.0
  - id: STKH_REQ__DEPENDABILITY__SAFETY_FEATURES_5
    type: stkh-req
    title: DMA Protection
    status: approved
    tags: [safety_mechanism]
    description: |
      The SW-platform shall support IO MMU protecting DMA accesses
      
      Note: Support means here that a functionality offered by external SW (e.g. an OS) or HW may need to be configured and used.
    fields:
      req-type: Functional
      security: "YES"
      safety-level: ASIL_B
      rationale: DMA function usually grants also QM HW direct access to memory.
      valid-from: v1.0.0
  - id: STKH_REQ__DEPENDABILITY__SAFETY_FEATURES_6
    type: stkh-req
    title: Memory Protection
    status: approved
    tags: [safety_mechanism]
    description: |
      The SW-platform shall support Memory Management Unit
      
      Note: Support means here that a functionality offered by external SW (e.g. an OS) or HW may need to be configured and used.
    fields:
      req-type: Functional
      security: "YES"
      safety-level: ASIL_B
      rationale: ASIL SW components memory may be corrupted by QM SW components if those are located on the the same physical memory.
      valid-from: v1.0.0
  - id: STKH_REQ__DEPENDABILITY__SAFETY_FEATURES_7
    type: stkh-req
    title: Cache Protection
    status: approved
    tags: [safety_mechanism]
    description: |
      The SW-platform shall support Memory Protection Unit for caches
      
      Note: Support means here that a functionality offered by external SW (e.g. an OS) or HW may need to be configured and used.
    fields:
      req-type: Functional
      security: "YES"
      safety-level: ASIL_B
      rationale: ASIL SW components memory may be corrupted by QM SW components if those are located on the the same physical memory.
      valid-from: v1.0.0
  - id: STKH_REQ__DEPENDABILITY__SAFETY_FEATURES_8
    type: stkh-req
    title: Memory Error Correction
    status: approved
    tags: [safety_mechanism]
    description: |
      The SW-platform shall support ECC Memory
      
      Note: Support means here that a functionality offered by external SW (e.g. an OS) or HW may need to be configured and used.
    fields:
      req-type: Functional
      security: "YES"
      safety-level: ASIL_B
      rationale: HW errors may occurr on the memory (e.g. bitflips caused by radiation)
      valid-from: v1.0.0
  - id: STKH_REQ__DEPENDABILITY__SAFETY_FEATURES_9
    type: stkh-req
    title: SW Lockstep
    status: approved
    tags: [safety_mechanism]
    description: |
      The SW-platform shall implement Software Lockstep
    fields:
      req-type: Functional
      security: "YES"
      safety-level: ASIL_B
      rationale: Computing HW may suffer from systematic or random HW errors.
      valid-from: v2.0.0
  - id: STKH_REQ__DEPENDABILITY__SAFETY_FEATURES_10
    type: stkh-req
    title: External Supervision
    status: approved
    tags: [safety_mechanism]
    description: |
      The SW-platform shall support Power management integrated circuit (PMIC), external watchdog and voltage monitoring
      
      Note: Support means here that a functionality offered by external SW (e.g. an OS) or HW may need to be configured and used.
    fields:
      req-type: Functional
      security: "YES"
      safety-level: ASIL_B
      rationale: The SW platform may run on malfunctioning HW (e.g. by undervoltage) which prevents from own error detection and recovery.
      valid-from: v1.0.0
  - id: STKH_REQ__DEPENDABILITY__SAFETY_FEATURES_11
    type: stkh-req
    title: Safe Mode Switch
    status: approved
    tags: [safety_mechanism]
    description: |
      The SW-platform shall implement Safe switch from engineering to field mode and back
    fields:
      req-type: Functional
      security: "YES"
      safety-level: ASIL_B
      rationale: "It is expected that the SW platform is used in systems in having engineering (development) modes and field (customer) modes, where engineering modes may allow functionality which is unsafe."
      valid-from: v1.0.0
  - id: STKH_REQ__DEPENDABILITY__ERROR_REACTION
    type: stkh-req
    title: SW-platform error reaction
    status: approved
    tags: [safety_mechanism]
    description: |
      The SW-platform shall react in the following way on errors:
      
      - report the error (incl. details if available) to the calling user function
      
      Note: See also :need:`stkh_req__dependability__safe_state`
    fields:
      req-type: Functional
      security: "NO"
      safety-level: ASIL_B
      rationale: "Safety relies on error reporting, e.g. to preserve a safe system state."
  - id: STKH_REQ__DEPENDABILITY__SAFE_STATE
    type: stkh-req
    title: Safe SW-platform state
    status: approved
    tags: [safety_mechanism]
    description: |
      The SW-platform shall react in the following way on errors:
      
      - in case of an unrecoverable error (e.g. access violations), report the error to the external health monitor
      
      Note1: Together with :need:`stkh_req__dependability__error_reaction` the "safe state" of the SW-platform can be described as "error reported".
      
      Note2: The implementation of the reporting of an unrecoverable error must take into account that after such an error
      the functions of the SW-platform may be corrupted (solution for this may be a cyclic triggering of an external watchdog in the healthy case
      and stopping the triggering in the error case).
    fields:
      req-type: Functional
      security: "NO"
      safety-level: ASIL_B
      rationale: A safe state definition is a common expectation of safety integrity standards.
      valid-from: v1.0.0
  - id: STKH_REQ__DEPENDABILITY__ERROR_REPORT_TIMING
    type: stkh-req
    title: Error report timing
    status: approved
    tags: [safety_mechanism]
    description: |
      The SW-platform shall react on errors (as described in :need:`stkh_req__dependability__safe_state` and :need:`stkh_req__dependability__error_reaction`) within 1 millisecond. If this is not feasible a special component AoU needs to be defined.
      
      Note1: The time span mentioned is the SW reaction time and not the time between the error happening and the reporting.
      For example if there is a alive supervision configured with 10ms cycle time and 5ms allowed delay,
      the error could happen in the first millisecond but will be reported earliest after 10+5ms plus the SW reaction time.
      
      Note2: If a user application calls a SW-platform function the (error) return is required latest after the reaction time, so there could be a timeout used by the application considering this.
    fields:
      req-type: Functional
      security: "NO"
      safety-level: ASIL_B
      rationale: "It is assumed that there is a need to know how much time is allowed between the ocurrence of an error and the reporting, so we define a feasible time span."
      valid-from: v1.0.0
  - id: STKH_REQ__DEPENDABILITY__NO_MIXED_ASIL
    type: stkh-req
    title: No mixed ASIL
    status: approved
    description: |
      The SW-platform safety components running in one POSIX process shall implement the highest ASIL of their assigned functional requirements.
    fields:
      req-type: Functional
      security: "YES"
      safety-level: ASIL_B
      rationale: It is assumed that POSIX processes as implemented by the OS provide isolation from memory and timing errors of other processes but not within.
  - id: STKH_REQ__DEPENDABILITY__FLOW_MONITORING
    type: stkh-req
    title: Program Flow Monitoring
    status: approved
    description: |
      The SW-platform safety components shall use program flow monitoring to detect run time errors or explain in their safety concept why they do not need this.
      
      Note1: Reasons for not needing program flow monitoring could be an OS scheduler with timing and execution guarantees.
      Or that the non/late execution of the application keeps the system in a safe state.
      
      Note2: The SW-Platform supports this - see :need:`stkh_req__dependability__safety_features_1` "live, deadline, logical supervision"
    fields:
      req-type: Functional
      security: "YES"
      safety-level: ASIL_B
      rationale: "Not all POSIX operating systems provide protection of POSIX processes from timing errors (e.g. delayed execution, deadlocks)"
      valid-from: v1.0.0
  - id: STKH_REQ__DEPENDABILITY__AVAILABILITY
