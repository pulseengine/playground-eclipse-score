# Eclipse S-CORE `module_template` (forked into pulseengine).
#
# Source: https://github.com/eclipse-score/module_template
project:
  name: eclipse-score-module_template
  version: "0.1.0"
  schemas:
    - common
    - score

sources:
  - path: artifacts
    format: generic-yaml

docs:
  - docs/docs/features/feature_example/architecture
  - docs/docs/features/feature_example/safety_analysis
  - docs/docs/features/feature_example/safety_planning
  - docs/docs/features/feature_example/security_analysis
  - docs/docs/features/feature_example/security_planning
  - docs/docs/manuals
  - docs/docs/release
  - docs/docs/safety_mgt
  - docs/docs/security_mgt
  - docs/docs/verification_report
  - docs/examples/docs
  - docs/score/component_example/docs
  - docs/score/component_example/docs/architecture
  - docs/score/component_example/docs/detailed_design
  - docs/score/component_example/docs/requirements
  - docs/score/component_example/docs/safety_analysis
