    type: comp-req
    title: Key Length
    status: approved
    description: |
      The component shall limit the maximum length of a key to 32 bytes.
    fields:
      req-type: Functional
      security: "NO"
      safety-level: ASIL_B
    links:
      - type: satisfies
        target: FEAT_REQ__PERSISTENCY__SUPPORT_DATATYPE_KEYS
      - type: belongs-to
        target: COMP__PERSISTENCY_KVS
