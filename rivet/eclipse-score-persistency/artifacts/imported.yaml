        target: WP__REQUIREMENTS_COMP
  - id: COMP_REQ__KVS__KEY_NAMING
    type: comp-req
    title: Key Naming
    status: approved
    description: |
      The component shall accept keys that consist solely of alphanumeric characters, underscores, or dashes.
    fields:
      req-type: Functional
      security: "NO"
      safety-level: ASIL_B
    links:
      - type: satisfies
        target: FEAT_REQ__PERSISTENCY__SUPPORT_DATATYPE_KEYS
      - type: belongs-to
        target: COMP__PERSISTENCY_KVS
  - id: COMP_REQ__KVS__KEY_ENCODING
    type: comp-req
    title: Key Encoding
    status: approved
    description: |
      The component shall encode each key as valid UTF-8.
    fields:
      req-type: Functional
      security: "NO"
      safety-level: ASIL_B
    links:
      - type: satisfies
        target: FEAT_REQ__PERSISTENCY__SUPPORT_DATATYPE_KEYS
      - type: belongs-to
        target: COMP__PERSISTENCY_KVS
  - id: COMP_REQ__KVS__KEY_UNIQUENESS
    type: comp-req
    title: Key Uniqueness
    status: approved
    description: |
      The component shall guarantee that each key is unique.
    fields:
      req-type: Functional
      security: "NO"
      safety-level: ASIL_B
    links:
      - type: satisfies
        target: FEAT_REQ__PERSISTENCY__SUPPORT_DATATYPE_KEYS
      - type: belongs-to
        target: COMP__PERSISTENCY_KVS
