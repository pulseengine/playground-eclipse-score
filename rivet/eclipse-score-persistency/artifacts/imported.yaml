    type: comp-req
    title: Value Data Types
    status: approved
    description: |
      The component shall accept only values of the following data types: Number,
      String, Null, Array[Value], or Dictionary{Key:Value}.
    fields:
      req-type: Functional
      security: "NO"
      safety-level: ASIL_B
    links:
      - type: satisfies
