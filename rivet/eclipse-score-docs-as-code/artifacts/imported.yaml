    title: Enforces presence of description
    status: approved
    tags: [Common Attributes]
    description: |
      Docs-as-Code shall enforce that each need of type :need:`tool_req__docs_req_types` has a description (content)
    fields:
      parent-covered: "NO: Can not cover 'ISO/IEC/IEEE/29148'"
      version: "1"
      implemented: "YES"
      safety-level: ASIL_B
